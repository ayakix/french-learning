# 00-7 聞いて正しい綴りを選ぶ（Web アプリの綴り選び画面 /spelling/review00 のデータ）
#
# 白紙のディクテーション（00-7-dictation.yaml）がいきなりでは難しすぎた（2026-10-06 に 2 / 25）ため、
# 「綴りを見て読み方を選ぶ」（rules）と「白紙から書く」（dictation）の間の段階として作った。単語は dictation と同じ 20 語。
#
# wrong（誤りの選択肢）は、どれも正解と**発音が違う**綴りにしている（maisson は [s]、moison は [wa] など）。
# 同じ発音の別の綴り（bateau と bato）を混ぜると、ルールではなく単語を知っているかの問題になるため。
# 誤りは、00-1〜00-6 で扱ったルールを 1 か所だけ取り違えた形にしている（どのルールでつまずいたかがわかるように）。
