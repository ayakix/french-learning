# 00-6 リエゾンの [z] があるかないかの聞き比べ（Web アプリの聞き比べ画面 /contrast/sz のデータ）
# 形式は 00-1-e-contrast.yaml と同じ
#
# ils sont（être）と ils ont（avoir）は、リエゾンの [z] か次の語の [s] かだけで動詞が変わる。
# A1 で最もよく使う 2 つの動詞なので、聞き分けを単独の練習にしている。
slug: sz
title: "ils sont [s] と ils ont [z]"
lead: "ils sont（彼らは〜だ）は s の音、ils ont（彼らは持っている）はリエゾンの z の音です。喉が震えるかどうかで、動詞が変わります。"
labels:
  a: { name: "[s]", hint: "息だけ。喉は震えない" }
  b: { name: "[z]", hint: "喉が震える。リエゾンの音" }
ladder:
  title: "ils sont → ils ont"
  fr: "ils sont... ils ont."
  steps:
    - { mark: "ils sont", ipa: "il.sɔ̃", mouth: "ils の s は読まず、sont の s を息だけで出す" }
    - { mark: "ils ont", ipa: "il.zɔ̃", mouth: "ils の s が次の ont とつながって、喉の震える [z] になる" }
  tip: "喉に手を当てて言い比べる。ils ont は il のあと切れ目なく「ゾン」につながる。"
pairs:
  - a: { fr: "ils sont", ipa: "il.sɔ̃", ja: "彼らは〜だ" }
    b: { fr: "ils ont", ipa: "il.zɔ̃", ja: "彼らは持っている" }
  - a: { fr: "elles sont", ipa: "ɛl.sɔ̃", ja: "彼女たちは〜だ" }
    b: { fr: "elles ont", ipa: "ɛl.zɔ̃", ja: "彼女たちは持っている" }
  - a: { fr: "nous savons", ipa: "nu.sa.vɔ̃", ja: "私たちは知っている" }
    b: { fr: "nous avons", ipa: "nu.za.vɔ̃", ja: "私たちは持っている" }
  - a: { fr: "deux sœurs", ipa: "dø.sœʁ", ja: "2 人の姉妹" }
    b: { fr: "deux heures", ipa: "dø.zœʁ", ja: "2 時" }
