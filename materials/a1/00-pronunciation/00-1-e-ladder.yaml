# 00-1 「i → é → è → a の階段」（Web アプリの「é と è」画面のデータ）
# 日本語の「エ」は é と è の中間にあるため、i と a を両端に置いて口の形の違いを体で覚える
- id: ladder
  fr: "i... é... è... a."
  steps:
    - { mark: "i", ipa: "i", mouth: "唇を思いきり横に引く" }
    - { mark: "é", ipa: "e", mouth: "唇は横に引いたまま、あごをほんの少しだけ下げる" }
    - { mark: "è", ipa: "ɛ", mouth: "唇の力を抜いて、あごをもう一段下げる" }
    - { mark: "a", ipa: "a", mouth: "あごをしっかり下げて、口を大きく開ける" }
