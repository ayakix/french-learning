# 00-1 é [e] と è [ɛ] の聞き比べ（Web アプリの「é と è」画面のデータ）
# é と è だけが違う単語のペア（ミニマルペア）。close が é [e]、open が è・ê・ai [ɛ]
# 綴りが違っても、音が [e] か [ɛ] かで分けている（例：lait の ai は [ɛ]）
- id: fee
  close: { fr: "fée", ipa: "fe", ja: "妖精" }
  open: { fr: "fait", ipa: "fɛ", ja: "事実" }
- id: pre
  close: { fr: "pré", ipa: "pʁe", ja: "草原" }
  open: { fr: "prêt", ipa: "pʁɛ", ja: "準備ができた" }
- id: les
  close: { fr: "les", ipa: "le", ja: "それらの（定冠詞の複数形）" }
  open: { fr: "lait", ipa: "lɛ", ja: "牛乳" }
- id: parle
  close: { fr: "parlé", ipa: "paʁle", ja: "話した（過去分詞）" }
  open: { fr: "parlais", ipa: "paʁlɛ", ja: "話していた（半過去）" }
