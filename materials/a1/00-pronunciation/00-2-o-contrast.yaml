# 00-2 o [o] と ɔ [ɔ] の聞き比べ（Web アプリの聞き比べ画面 /contrast/o のデータ）
# 形式は 00-1-e-contrast.yaml と同じ
#
# [ɔ] は単独で綴れないため、ladder は単音ではなく例の単語で口の形を示す。
# pairs はどれも ô・au のある方が閉じた [o] になっていて、見分け方のルールの確認にもなる。
slug: o
title: "o [o] と ɔ [ɔ]"
lead: "é と è と同じく、唇をすぼめた閉じた o [o] と、口を縦に開けた ɔ [ɔ] があります。間違えても通じなくなることはほとんどないので、優先度は低めです。"
labels:
  a: { name: "o [o]", hint: "唇をすぼめる" }
  b: { name: "ɔ [ɔ]", hint: "口を縦に開ける" }
ladder:
  title: "閉じた o と開いた ɔ"
  fr: "mot... beau... porte... école."
  steps:
    - { mark: "mot", ipa: "mo", mouth: "語末の o → 閉じた [o]。唇を丸めてすぼめる" }
    - { mark: "beau", ipa: "bo", mouth: "eau・au・ô → 閉じた [o]" }
    - { mark: "porte", ipa: "pɔʁt", mouth: "o の後ろに読む子音 → 開いた [ɔ]。口を縦に開ける" }
    - { mark: "école", ipa: "ekɔl", mouth: "同じく開いた [ɔ]（最初の é は口を横に引く）" }
  tip: "目安：単語の最後の o と、ô・au・eau は閉じた [o]。後ろに読む子音があれば開いた [ɔ]（ただし ô は子音があっても [o]：rôle [ʁol]）。"
pairs:
  - a: { fr: "paume", ipa: "pom", ja: "手のひら" }
    b: { fr: "pomme", ipa: "pɔm", ja: "りんご" }
  - a: { fr: "côte", ipa: "kot", ja: "海岸" }
    b: { fr: "cote", ipa: "kɔt", ja: "評価・相場" }
  - a: { fr: "nôtre", ipa: "notʁ", ja: "私たちのもの" }
    b: { fr: "notre", ipa: "nɔtʁ", ja: "私たちの" }
  - a: { fr: "saute", ipa: "sot", ja: "跳ぶ（sauter の活用）" }
    b: { fr: "sotte", ipa: "sɔt", ja: "愚かな（女性形）" }
