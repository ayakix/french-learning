# 00-5 フランス語の r [ʁ] と l [l] の聞き比べ（Web アプリの聞き比べ画面 /contrast/r のデータ）
# 形式は 00-1-e-contrast.yaml と同じ
#
# r は単独で練習しても正しく出せているか確かめにくいので、日本語話者が混ぜやすい l とのペアで聞き分ける。
# 日本語の「ら行」は r とも l とも違う音（舌先で上あごを弾く）なので、どちらにも聞こえやすい。
slug: r
title: "r [ʁ] と l [l]"
lead: "フランス語の r は舌先を使わず、喉の奥で軽くこする音です。l は舌先を上の歯の裏につけたまま出します。日本語の「ら行」はどちらとも違います。"
labels:
  a: { name: "[ʁ] r", hint: "喉の奥でこする。うがいの音に近い" }
  b: { name: "[l] l", hint: "舌先を上の歯の裏につける" }
ladder:
  title: "ha → ra → la"
  fr: "ra... la."
  steps:
    - { mark: "h", ipa: "h", mouth: "「ハ」と強く息を出す" }
    - { mark: "r", ipa: "ʁ", mouth: "その「ハ」を喉の奥（のどちんこのあたり）で少しこすれるように出す。舌先は下の歯の裏に置いたまま" }
    - { mark: "l", ipa: "l", mouth: "舌先を上の歯の裏につけたまま、舌の両側から声を出す" }
  tip: "r で舌先が動いたら、日本語の「ら」になっている。舌先は下の歯の裏から離さない。"
pairs:
  - a: { fr: "riz", ipa: "ʁi", ja: "米" }
    b: { fr: "lit", ipa: "li", ja: "ベッド" }
  - a: { fr: "roue", ipa: "ʁu", ja: "車輪" }
    b: { fr: "loue", ipa: "lu", ja: "借りる（louer の活用）" }
  - a: { fr: "rond", ipa: "ʁɔ̃", ja: "丸い" }
    b: { fr: "long", ipa: "lɔ̃", ja: "長い" }
  - a: { fr: "rien", ipa: "ʁjɛ̃", ja: "何も〜ない" }
    b: { fr: "lien", ipa: "ljɛ̃", ja: "つながり・リンク" }
