# 00-5 s の [s] と [z] の聞き比べ（Web アプリの聞き比べ画面 /contrast/s のデータ）
# 形式は 00-1-e-contrast.yaml と同じ
#
# 綴りのルール（ss は [s]、母音にはさまれた s は [z]）は覚えやすいが、聞いて区別できないと
# poisson（魚）と poison（毒）のように意味を取り違えるので、聞き比べで練習する。
# ladder は単独の子音だと TTS が不自然になりやすいので、ペアの単語で読ませる。
slug: s
title: "s の [s] と [z]"
lead: "ss や語頭の s は [s]、母音にはさまれた 1 つの s は [z] です。違いは喉が震えるかどうかだけで、口の形は同じです。"
labels:
  a: { name: "[s] ss", hint: "息だけで、喉は震えない" }
  b: { name: "[z] s", hint: "喉が震える（日本語の「ず」の子音）" }
ladder:
  title: "poisson → poison"
  fr: "poisson... poison."
  steps:
    - { mark: "ss", ipa: "s", mouth: "喉に手を当てて「スー」。手に震えが伝わらない" }
    - { mark: "s", ipa: "z", mouth: "口の形はそのままで「ズー」。喉が震える" }
  tip: "日本語の「ず」は舌が上あごにつく「dz」になりやすい。舌はつけずに、すき間から息を出し続ける。"
pairs:
  - a: { fr: "poisson", ipa: "pwasɔ̃", ja: "魚" }
    b: { fr: "poison", ipa: "pwazɔ̃", ja: "毒" }
  - a: { fr: "dessert", ipa: "desɛʁ", ja: "デザート" }
    b: { fr: "désert", ipa: "dezɛʁ", ja: "砂漠" }
  - a: { fr: "coussin", ipa: "kusɛ̃", ja: "クッション" }
    b: { fr: "cousin", ipa: "kuzɛ̃", ja: "いとこ" }
  - a: { fr: "russe", ipa: "ʁys", ja: "ロシアの" }
    b: { fr: "ruse", ipa: "ʁyz", ja: "策略" }
  - a: { fr: "basse", ipa: "bas", ja: "低い（女性形）" }
    b: { fr: "base", ipa: "baz", ja: "基礎" }
