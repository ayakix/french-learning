# 00-1 é [e] と è [ɛ] の聞き比べ（Web アプリの聞き比べ画面 /contrast/e のデータ）
# slug: URL とクイズの種類名 / labels: 2 つの音の名前とヒント / ladder: 口の形の練習 / pairs: ミニマルペア
#
# ladder で i と a を両端に置くのは、日本語の「エ」が é と è の中間にあるため、口の形の違いを体で覚えるため。
# pairs は綴りではなく音で分けている（例：lait の ai は [ɛ]）。
slug: e
title: "é [e] と è [ɛ]"
lead: "日本語の「エ」は、é と è のちょうど中間にあります。é は「イ」寄り、è は「ア」寄りの「エ」です。"
labels:
  a: { name: "é [e]", hint: "口を横に引く" }
  b: { name: "è [ɛ]", hint: "あごを下げる" }
ladder:
  title: "i → é → è → a の階段"
  fr: "i... é... è... a."
  steps:
    - { mark: "i", ipa: "i", mouth: "唇を思いきり横に引く" }
    - { mark: "é", ipa: "e", mouth: "唇は横に引いたまま、あごをほんの少しだけ下げる" }
    - { mark: "è", ipa: "ɛ", mouth: "唇の力を抜いて、あごをもう一段下げる" }
    - { mark: "a", ipa: "a", mouth: "あごをしっかり下げて、口を大きく開ける" }
  tip: "鏡を見ながら、あごを 1 段ずつ下げていく。口の前に指を縦に当てると、è のほうが上下の歯の間が広いことを確かめられる。"
pairs:
  - a: { fr: "fée", ipa: "fe", ja: "妖精" }
    b: { fr: "fait", ipa: "fɛ", ja: "事実" }
  - a: { fr: "pré", ipa: "pʁe", ja: "草原" }
    b: { fr: "prêt", ipa: "pʁɛ", ja: "準備ができた" }
  - a: { fr: "les", ipa: "le", ja: "それらの（定冠詞の複数形）" }
    b: { fr: "lait", ipa: "lɛ", ja: "牛乳" }
  - a: { fr: "parlé", ipa: "paʁle", ja: "話した（過去分詞）" }
    b: { fr: "parlais", ipa: "paʁlɛ", ja: "話していた（半過去）" }
