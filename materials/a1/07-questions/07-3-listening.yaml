# 単元 07 聞き取り 3：友達からの留守番電話（DELF A1 の voicemail 形式）
# 留守番電話は相手に聞き返せないので、質問の内容（何を・どこで・何時に）を 1 回で聞き取る練習になる。
# 誘いの質問（Est-ce que tu es libre ?）と、頼みごと（Tu peux apporter ... ?）を入れている。
unit: "07"
title: "ジュリーからの留守番電話"
type: "voicemail"
situation: "トマの携帯に、友達のジュリーから留守番電話のメッセージが入っている"
speakers:
  julie: { name: "Julie", voice: "claire" }
lines:
  - { speaker: "julie", voice: "claire", fr: "Salut Thomas, c'est Julie !", ja: "やあトマ、ジュリーだよ！" }
  - { speaker: "julie", voice: "claire", fr: "Est-ce que tu es libre samedi soir ? C'est l'anniversaire de Paul.", ja: "土曜日の夜は空いてる？ポールの誕生日なの。" }
  - { speaker: "julie", voice: "claire", fr: "On va au restaurant italien, à côté de la gare. Tu viens avec nous ?", ja: "駅の隣のイタリアンレストランに行くんだ。一緒に来る？" }
  - { speaker: "julie", voice: "claire", fr: "Le rendez-vous, c'est à vingt heures, devant le restaurant.", ja: "待ち合わせは 20 時、レストランの前だよ。" }
  - { speaker: "julie", voice: "claire", fr: "Et est-ce que tu peux apporter un gâteau ? Paul adore le chocolat !", ja: "それと、ケーキを持ってきてくれる？ポールはチョコレートが大好きなの！" }
  - { speaker: "julie", voice: "claire", fr: "Rappelle-moi ce soir, d'accord ? Bisous !", ja: "今夜折り返し電話してね。じゃあね！" }
questions:
  - q: "Où est le rendez-vous ?"
    q_ja: "待ち合わせ場所はどこ？"
    choices: ["devant la gare", "devant le restaurant", "chez Paul"]
    answer: 1
  - q: "Le rendez-vous est à quelle heure ?"
    q_ja: "待ち合わせは何時？"
    choices: ["19 h", "20 h", "21 h"]
    answer: 1
  - q: "Qu'est-ce que Julie demande à Thomas ?"
    q_ja: "ジュリーはトマに何を頼んでいる？"
    choices: ["d'apporter un gâteau", "de réserver le restaurant", "d'appeler Paul"]
    answer: 0
