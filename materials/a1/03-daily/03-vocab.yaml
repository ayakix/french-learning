      - {fr: "une nuit", ipa: "yn nɥi", ja: "夜", pos: "名詞", g: "f"}
      - {fr: "une journée", ipa: "yn ʒuʁne", ja: "一日（日中）", pos: "名詞", g: "f"}
      - {fr: "le matin", ipa: "lə matɛ̃", ja: "朝に（いつも）", pos: "表現", note: "定冠詞 le で「毎朝」の習慣を表す"}
