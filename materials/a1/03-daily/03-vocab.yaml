# 単元 03 一日の生活 の必須単語（Web アプリの単語画面 /vocab/03 のデータ）
# 名詞は不定冠詞 un / une を付けて読ませる。性（男性・女性）を音で一緒に覚えるため。
# 時刻・曜日・数字は common で扱うので入れない。d'abord / ensuite / après などの順番の言葉は 09 で扱う。
# 代名動詞は se を付けた形で覚える。「起こす (réveiller)」と「起きる (se réveiller)」のように、se の有無で意味が変わるため。
unit: "03"
title: "一日の生活"
groups:
  - name: "朝のしたく"
    words:
      - {fr: "se réveiller", ipa: "sə ʁeveje", ja: "目を覚ます", pos: "動詞"}
      - {fr: "se lever", ipa: "sə ləve", ja: "起きる（起き上がる）", pos: "動詞", note: "目を覚ますのは se réveiller、ベッドから出るのが se lever"}
      - {fr: "se laver", ipa: "sə lave", ja: "体を洗う", pos: "動詞"}
      - {fr: "se doucher", ipa: "sə duʃe", ja: "シャワーを浴びる", pos: "動詞"}
      - {fr: "prendre une douche", ipa: "pʁɑ̃dʁ yn duʃ", ja: "シャワーを浴びる", pos: "表現"}
      - {fr: "se brosser les dents", ipa: "sə bʁɔse le dɑ̃", ja: "歯を磨く", pos: "表現", note: "体の部分には所有形容詞ではなく定冠詞 les を使う（se で誰の歯かわかるため）"}
      - {fr: "s'habiller", ipa: "sabije", ja: "服を着る", pos: "動詞"}
      - {fr: "se maquiller", ipa: "sə makije", ja: "化粧をする", pos: "動詞"}
      - {fr: "se raser", ipa: "sə ʁaze", ja: "ひげを剃る", pos: "動詞"}
      - {fr: "se coiffer", ipa: "sə kwafe", ja: "髪を整える", pos: "動詞"}
      - {fr: "se préparer", ipa: "sə pʁepaʁe", ja: "したくをする", pos: "動詞"}
      - {fr: "se dépêcher", ipa: "sə depeʃe", ja: "急ぐ", pos: "動詞"}
      - {fr: "réveiller", ipa: "ʁeveje", ja: "（人を）起こす", pos: "動詞"}
      - {fr: "un petit-déjeuner", ipa: "œ̃ pəti deʒœne", ja: "朝食", pos: "名詞", g: "m"}
      - {fr: "prendre le petit-déjeuner", ipa: "pʁɑ̃dʁ lə pəti deʒœne", ja: "朝食をとる", pos: "表現"}
      - {fr: "déjeuner", ipa: "deʒœne", ja: "昼食をとる", pos: "動詞"}
      - {fr: "un déjeuner", ipa: "œ̃ deʒœne", ja: "昼食", pos: "名詞", g: "m"}
      - {fr: "dîner", ipa: "dine", ja: "夕食をとる", pos: "動詞"}
      - {fr: "un dîner", ipa: "œ̃ dine", ja: "夕食", pos: "名詞", g: "m"}
  - name: "家での時間"
    words:
      - {fr: "rentrer", ipa: "ʁɑ̃tʁe", ja: "帰る（家に戻る）", pos: "動詞"}
      - {fr: "se reposer", ipa: "sə ʁəpoze", ja: "休む", pos: "動詞"}
      - {fr: "se coucher", ipa: "sə kuʃe", ja: "寝る（床に就く）", pos: "動詞"}
      - {fr: "s'endormir", ipa: "sɑ̃dɔʁmiʁ", ja: "眠りにつく", pos: "動詞"}
      - {fr: "dormir", ipa: "dɔʁmiʁ", ja: "眠る", pos: "動詞"}
      - {fr: "préparer", ipa: "pʁepaʁe", ja: "準備する・（料理を）作る", pos: "動詞"}
      - {fr: "ranger", ipa: "ʁɑ̃ʒe", ja: "片付ける", pos: "動詞"}
      - {fr: "nettoyer", ipa: "netwaje", ja: "掃除する", pos: "動詞"}
      - {fr: "laver", ipa: "lave", ja: "（物を）洗う", pos: "動詞"}
      - {fr: "téléphoner", ipa: "telefɔne", ja: "電話する", pos: "動詞"}
      - {fr: "une douche", ipa: "yn duʃ", ja: "シャワー", pos: "名詞", g: "f"}
      - {fr: "un bain", ipa: "œ̃ bɛ̃", ja: "風呂（入浴）", pos: "名詞", g: "m"}
      - {fr: "une habitude", ipa: "yn abityd", ja: "習慣", pos: "名詞", g: "f"}
      - {fr: "une routine", ipa: "yn ʁutin", ja: "日課", pos: "名詞", g: "f"}
