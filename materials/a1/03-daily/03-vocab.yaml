      - {fr: "rarement", ipa: "ʁaʁmɑ̃", ja: "めったに〜ない", pos: "副詞"}
      - {fr: "d'habitude", ipa: "dabityd", ja: "ふだんは", pos: "副詞"}
      - {fr: "normalement", ipa: "nɔʁmalmɑ̃", ja: "ふつうは", pos: "副詞"}
