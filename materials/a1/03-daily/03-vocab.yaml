      - {fr: "fatigué", ipa: "fatiɡe", ja: "疲れた", pos: "形容詞", f: "fatiguée", f_ipa: "fatiɡe", tts: "fatigué, fatiguée", note: "女性形は e が付くだけで発音は同じ"}
      - {fr: "occupé", ipa: "ɔkype", ja: "忙しい", pos: "形容詞", f: "occupée", f_ipa: "ɔkype", tts: "occupé, occupée"}
      - {fr: "libre", ipa: "libʁ", ja: "暇な・空いている", pos: "形容詞"}
  - name: "一日の時間帯"
