      - {fr: "vite", ipa: "vit", ja: "速く・急いで", pos: "副詞"}
      - {fr: "vers", ipa: "vɛʁ", ja: "〜ごろ", pos: "前置詞", note: "vers sept heures（7 時ごろ）のように時刻の前に置く"}
