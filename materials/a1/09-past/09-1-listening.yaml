# 単元 09 の聞き取り 1（会話）。月曜日に週末のことを話す、DELF A1 によくある短い会話。
# 「どこへ・何で・いつ」を聞く。複合過去の avoir と être（女性の一致 allée / rentrée）を両方聞かせるため。
unit: "09"
title: "週末はどうだった？"
type: "dialogue"
situation: "月曜日の朝、職場でトマとレアが週末のことを話す"
speakers:
  thomas: { name: "Thomas" }
  lea: { name: "Léa", voice: "lucie" }
lines:
  - { speaker: "thomas", fr: "Salut Léa ! Tu as passé un bon week-end ?", ja: "やあ、レア！いい週末だった？" }
  - { speaker: "lea", voice: "lucie", fr: "Oui, super ! Samedi, je suis allée à Lille chez ma sœur.", ja: "うん、最高！土曜日にリールの姉の家に行ったの。" }
  - { speaker: "thomas", fr: "Ah bon ? Tu as pris le train ?", ja: "へえ、電車で行ったの？" }
  - { speaker: "lea", voice: "lucie", fr: "Oui, le train de huit heures.", ja: "うん、8 時の電車。" }
  - { speaker: "thomas", fr: "Et qu'est-ce que vous avez fait ?", ja: "それで、何をしたの？" }
  - { speaker: "lea", voice: "lucie", fr: "D'abord, nous avons visité un musée, puis nous avons mangé au restaurant.", ja: "まず美術館に行って、それからレストランで食べたよ。" }
  - { speaker: "thomas", fr: "Et tu es rentrée quand ?", ja: "いつ帰ってきたの？" }
  - { speaker: "lea", voice: "lucie", fr: "Dimanche soir, vers vingt heures.", ja: "日曜の夜、20 時ごろ。" }
questions:
  - q: "Où est allée Léa ?"
    q_ja: "レアはどこへ行きましたか？"
    choices: ["À Lille", "À Lyon", "À Nice"]
    answer: 0
  - q: "Comment est-elle allée chez sa sœur ?"
    q_ja: "レアは何で姉の家へ行きましたか？"
    choices: ["En voiture", "En train", "En bus"]
    answer: 1
  - q: "Quand est-elle rentrée ?"
    q_ja: "レアはいつ帰ってきましたか？"
    choices: ["Samedi soir", "Dimanche matin", "Dimanche soir"]
    answer: 2
