# 単元 05 聞き取り 2：引っ越した友達と住まいの話をする会話（DELF A1 の「短い会話」形式）
# 住まいの説明で必ず出る「階（étage）」「il y a / il n'y a pas de」「近くにあるもの」を聞き取らせる。
# 「ないもの」を問う質問を入れたのは、否定の n'y a pas を聞き落とす間違いが多いため。
unit: "05"
title: "新しいアパート"
type: "dialogue"
situation: "レアが、引っ越したばかりのトマに新しいアパートについて聞く"
speakers:
  thomas: { name: "Thomas" }
  lea: { name: "Léa", voice: "claire" }
lines:
  - { speaker: "lea", voice: "claire", fr: "Salut Thomas ! Alors, ton nouvel appartement ?", ja: "やあトマ！で、新しいアパートはどう？" }
  - { speaker: "thomas", fr: "Il est super ! Il est près de la gare, au quatrième étage.", ja: "最高だよ！駅の近くで、5 階なんだ。" }
  - { speaker: "lea", voice: "claire", fr: "Il y a un ascenseur ?", ja: "エレベーターはあるの？" }
  - { speaker: "thomas", fr: "Non, il n'y a pas d'ascenseur. Mais l'appartement est grand et très clair.", ja: "ううん、エレベーターはないんだ。でも部屋は広くてとても明るいよ。" }
  - { speaker: "lea", voice: "claire", fr: "Il y a deux chambres ?", ja: "寝室は 2 つ？" }
  - { speaker: "thomas", fr: "Non, une chambre, un salon et une petite cuisine.", ja: "いや、寝室 1 つとリビングと小さな台所。" }
  - { speaker: "lea", voice: "claire", fr: "Et le quartier, il est calme ?", ja: "それで、地区は静か？" }
  - { speaker: "thomas", fr: "Oui, très calme. Et il y a un parc derrière l'immeuble.", ja: "うん、とても静か。それに建物の裏に公園があるんだ。" }
questions:
  - q: "L'appartement de Thomas est à quel étage ?"
    q_ja: "トマのアパートは何階？"
    choices: ["Au deuxième étage", "Au troisième étage", "Au quatrième étage"]
    answer: 2
  - q: "Qu'est-ce qu'il n'y a pas dans l'immeuble ?"
    q_ja: "建物に「ない」ものは？"
    choices: ["Un ascenseur", "Un salon", "Une cuisine"]
    answer: 0
  - q: "Qu'est-ce qu'il y a derrière l'immeuble ?"
    q_ja: "建物の裏には何がある？"
    choices: ["Une gare", "Un parc", "Une banque"]
    answer: 1
