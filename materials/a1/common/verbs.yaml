      - { fr: "il attend", ipa: "il atɑ̃" }
      - { fr: "nous attendons", ipa: "nu zatɑ̃dɔ̃", note: "リエゾン" }
      - { fr: "vous attendez", ipa: "vu zatɑ̃de", note: "リエゾン" }
      - { fr: "ils attendent", ipa: "il zatɑ̃d", note: "リエゾン。複数は d を読む" }
    past: { fr: "j'ai attendu", ipa: "ʒe atɑ̃dy" }
