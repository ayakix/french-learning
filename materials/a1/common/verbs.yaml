    present:
      - { fr: "j'aime", ipa: "ʒɛm" }
      - { fr: "tu aimes", ipa: "ty ɛm" }
      - { fr: "il aime", ipa: "il ɛm", note: "アンシェヌマン" }
      - { fr: "nous aimons", ipa: "nu zɛmɔ̃", note: "リエゾン" }
      - { fr: "vous aimez", ipa: "vu zɛme", note: "リエゾン" }
      - { fr: "ils aiment", ipa: "il zɛm", note: "リエゾン。il aime と聞き分ける" }
    past: { fr: "j'ai aimé", ipa: "ʒe eme" }
  - slug: "preferer"
