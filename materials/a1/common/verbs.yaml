      - { fr: "tu sors", ipa: "ty sɔʁ" }
      - { fr: "il sort", ipa: "il sɔʁ" }
      - { fr: "nous sortons", ipa: "nu sɔʁtɔ̃" }
      - { fr: "vous sortez", ipa: "vu sɔʁte" }
      - { fr: "ils sortent", ipa: "il sɔʁt" }
    past: { fr: "je suis sorti(e)", ipa: "ʒə sɥi sɔʁti", tts: "je suis sorti", note: "移動の動詞なので助動詞 être" }
