      - { fr: "tu fais", ipa: "ty fɛ" }
      - { fr: "il fait", ipa: "il fɛ" }
      - { fr: "nous faisons", ipa: "nu fəzɔ̃", note: "ai を [ə] と読む例外" }
      - { fr: "vous faites", ipa: "vu fɛt", note: "-ez にならない" }
      - { fr: "ils font", ipa: "il fɔ̃" }
    past: { fr: "j'ai fait", ipa: "ʒe fɛ" }
  - slug: "aimer"
