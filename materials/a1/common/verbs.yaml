# 動詞の現在形の活用 ＋ 複合過去の例（単元をまたいで使う教材）
# A1 で使う動詞を、最初に習う単元の順に並べた。単元ごとの単語ファイル（<NN>-vocab.yaml）では不定詞だけを扱い、活用はここにまとめる。
#
# inf は表示用（キーが fr だと音声化されてしまうため）。不定詞の音声は infinitive に別に持つ。
# il / elle、ils / elles は発音が同じなので il / ils だけ載せる。
# past は複合過去の je の形 1 つだけ。助動詞が avoir か être かを覚えるのが目的なので。
# note は動詞全体の補足で、英語と比べて同じ点・違う点を書く（英語を足場にすると理解が早いため。2026-10-10）
# être 助動詞の動詞は allé(e) のように表示し、tts には男性形を書く（(e) を TTS に読ませないため）。
title: "動詞の活用"
verbs:
  - slug: "etre"
    inf: "être"
    ipa: "ɛtʁ"
    ja: "〜である・いる"
    unit: "01"
    type: "不規則"
    note: "英語の be。主語ごとに形が全部変わる（英語は am / are / is の 3 つだけ）。Je suis japonais. = I am Japanese. ただし年齢は être ではなく avoir で言う"
    infinitive: { fr: "être", ipa: "ɛtʁ" }
    present:
      - { fr: "je suis", ipa: "ʒə sɥi" }
      - { fr: "tu es", ipa: "ty ɛ" }
      - { fr: "il est", ipa: "il ɛ" }
      - { fr: "nous sommes", ipa: "nu sɔm" }
      - { fr: "vous êtes", ipa: "vu zɛt", note: "リエゾン" }
      - { fr: "ils sont", ipa: "il sɔ̃", note: "ils ont [il zɔ̃] と聞き分ける" }
    past: { fr: "j'ai été", ipa: "ʒe ete", note: "助動詞は avoir" }
  - slug: "sappeler"
    inf: "s'appeler"
    ipa: "saple"
    ja: "〜という名前である"
    unit: "01"
    type: "代名動詞（-er）"
    note: "英語の My name is… にあたる。直訳は「自分を〜と呼ぶ」（call oneself）。Je m'appelle Yuki. = My name is Yuki."
    infinitive: { fr: "s'appeler", ipa: "saple" }
    present:
      - { fr: "je m'appelle", ipa: "ʒə mapɛl", note: "l を 2 つ重ねて [ɛ] と読む" }
      - { fr: "tu t'appelles", ipa: "ty tapɛl" }
      - { fr: "il s'appelle", ipa: "il sapɛl" }
      - { fr: "nous nous appelons", ipa: "nu nu zaplɔ̃", note: "l は 1 つ。e を読まない" }
      - { fr: "vous vous appelez", ipa: "vu vu zaple", note: "リエゾン" }
      - { fr: "ils s'appellent", ipa: "il sapɛl" }
    past: { fr: "je me suis appelé(e)", ipa: "ʒə mə sɥi zaple", tts: "je me suis appelé", note: "代名動詞は助動詞 être" }
  - slug: "habiter"
    inf: "habiter"
    ipa: "abite"
    ja: "住む"
    unit: "01"
    type: "-er 規則"
    note: "英語の live（住む）。J'habite à Tokyo. = I live in Tokyo. 都市の前の in は à になる"
    infinitive: { fr: "habiter", ipa: "abite" }
    present:
      - { fr: "j'habite", ipa: "ʒabit", note: "h は読まないので j' になる" }
      - { fr: "tu habites", ipa: "ty abit" }
      - { fr: "il habite", ipa: "il abit", note: "アンシェヌマン" }
      - { fr: "nous habitons", ipa: "nu zabitɔ̃", note: "リエゾン" }
      - { fr: "vous habitez", ipa: "vu zabite", note: "リエゾン" }
      - { fr: "ils habitent", ipa: "il zabit", note: "リエゾン。-ent は読まない" }
    past: { fr: "j'ai habité", ipa: "ʒe abite" }
  - slug: "parler"
    inf: "parler"
    ipa: "paʁle"
    ja: "話す"
    unit: "01"
    type: "-er 規則"
    note: "英語の speak / talk。Je parle anglais. = I speak English. 言語名に冠詞を付けないのは英語と同じ"
    infinitive: { fr: "parler", ipa: "paʁle" }
    present:
      - { fr: "je parle", ipa: "ʒə paʁl" }
      - { fr: "tu parles", ipa: "ty paʁl", note: "s は読まない" }
      - { fr: "il parle", ipa: "il paʁl" }
      - { fr: "nous parlons", ipa: "nu paʁlɔ̃" }
      - { fr: "vous parlez", ipa: "vu paʁle" }
      - { fr: "ils parlent", ipa: "il paʁl", note: "-ent は読まない。je / tu / il / ils は同じ音" }
    past: { fr: "j'ai parlé", ipa: "ʒe paʁle" }
  - slug: "avoir"
    inf: "avoir"
    ipa: "avwaʁ"
    ja: "持っている"
    unit: "02"
    type: "不規則"
    note: "英語の have。ただし英語で be を使う年齢・空腹なども avoir で言う：J'ai 30 ans. = I am 30. / J'ai faim. = I am hungry. 複合過去の助動詞になるのは英語の have（I have eaten）と同じ"
    infinitive: { fr: "avoir", ipa: "avwaʁ" }
    present:
      - { fr: "j'ai", ipa: "ʒe" }
      - { fr: "tu as", ipa: "ty a" }
      - { fr: "il a", ipa: "il a" }
      - { fr: "nous avons", ipa: "nu zavɔ̃", note: "リエゾン" }
      - { fr: "vous avez", ipa: "vu zave", note: "リエゾン" }
      - { fr: "ils ont", ipa: "il zɔ̃", note: "リエゾンで [z]。ils sont [il sɔ̃] と聞き分ける" }
    past: { fr: "j'ai eu", ipa: "ʒe y", note: "eu は [y] と読む" }
  - slug: "manger"
    inf: "manger"
    ipa: "mɑ̃ʒe"
    ja: "食べる"
    unit: "03"
    type: "-er 規則"
    note: "英語の eat。nous mangeons だけ g の後に e が入る（o の前でも g を [ʒ] で読ませるため）"
    infinitive: { fr: "manger", ipa: "mɑ̃ʒe" }
    present:
      - { fr: "je mange", ipa: "ʒə mɑ̃ʒ" }
      - { fr: "tu manges", ipa: "ty mɑ̃ʒ" }
      - { fr: "il mange", ipa: "il mɑ̃ʒ" }
      - { fr: "nous mangeons", ipa: "nu mɑ̃ʒɔ̃", note: "[ʒ] の音を保つため e を入れる" }
      - { fr: "vous mangez", ipa: "vu mɑ̃ʒe" }
      - { fr: "ils mangent", ipa: "il mɑ̃ʒ" }
    past: { fr: "j'ai mangé", ipa: "ʒe mɑ̃ʒe" }
  - slug: "commencer"
    inf: "commencer"
    ipa: "kɔmɑ̃se"
    ja: "始める・始まる"
    unit: "03"
    type: "-er 規則"
    note: "英語の begin / start（英語の commence と同じ語源）。nous commençons だけ c が ç になる（o の前でも [s] で読ませるため）"
    infinitive: { fr: "commencer", ipa: "kɔmɑ̃se" }
    present:
      - { fr: "je commence", ipa: "ʒə kɔmɑ̃s" }
      - { fr: "tu commences", ipa: "ty kɔmɑ̃s" }
      - { fr: "il commence", ipa: "il kɔmɑ̃s" }
      - { fr: "nous commençons", ipa: "nu kɔmɑ̃sɔ̃", note: "[s] の音を保つため c を ç にする" }
      - { fr: "vous commencez", ipa: "vu kɔmɑ̃se" }
      - { fr: "ils commencent", ipa: "il kɔmɑ̃s" }
    past: { fr: "j'ai commencé", ipa: "ʒe kɔmɑ̃se" }
  - slug: "se-lever"
    inf: "se lever"
    ipa: "sə ləve"
    ja: "起きる"
    unit: "03"
    type: "代名動詞（-er）"
    note: "英語の get up。直訳は「自分を起こす」。英語では oneself を付けないが、フランス語は me / te / se が必要"
    infinitive: { fr: "se lever", ipa: "sə ləve" }
    present:
      - { fr: "je me lève", ipa: "ʒə mə lɛv", note: "発音される語尾の前で e が è になる" }
      - { fr: "tu te lèves", ipa: "ty tə lɛv" }
      - { fr: "il se lève", ipa: "il sə lɛv" }
      - { fr: "nous nous levons", ipa: "nu nu ləvɔ̃", note: "語尾が発音されるので e のまま" }
      - { fr: "vous vous levez", ipa: "vu vu ləve" }
      - { fr: "ils se lèvent", ipa: "il sə lɛv" }
    past: { fr: "je me suis levé(e)", ipa: "ʒə mə sɥi ləve", tts: "je me suis levé", note: "代名動詞は助動詞 être" }
  - slug: "se-coucher"
    inf: "se coucher"
    ipa: "sə kuʃe"
    ja: "寝る（床につく）"
    unit: "03"
    type: "代名動詞（-er）"
    note: "英語の go to bed。直訳は「自分を寝かせる」。se lever と同じく me / te / se が必要"
    infinitive: { fr: "se coucher", ipa: "sə kuʃe" }
    present:
      - { fr: "je me couche", ipa: "ʒə mə kuʃ" }
      - { fr: "tu te couches", ipa: "ty tə kuʃ" }
      - { fr: "il se couche", ipa: "il sə kuʃ" }
      - { fr: "nous nous couchons", ipa: "nu nu kuʃɔ̃" }
      - { fr: "vous vous couchez", ipa: "vu vu kuʃe" }
      - { fr: "ils se couchent", ipa: "il sə kuʃ" }
    past: { fr: "je me suis couché(e)", ipa: "ʒə mə sɥi kuʃe", tts: "je me suis couché", note: "代名動詞は助動詞 être" }
  - slug: "prendre"
    inf: "prendre"
    ipa: "pʁɑ̃dʁ"
    ja: "取る・（乗り物に）乗る・（食事を）とる"
    unit: "03"
    type: "不規則"
    note: "英語の take。食べ物・飲み物・乗り物にも使う：Je prends un café. = I'll have a coffee. / Je prends le bus. = I take the bus."
    infinitive: { fr: "prendre", ipa: "pʁɑ̃dʁ" }
    present:
      - { fr: "je prends", ipa: "ʒə pʁɑ̃", note: "d・s は読まない" }
      - { fr: "tu prends", ipa: "ty pʁɑ̃" }
      - { fr: "il prend", ipa: "il pʁɑ̃" }
      - { fr: "nous prenons", ipa: "nu pʁənɔ̃" }
      - { fr: "vous prenez", ipa: "vu pʁəne" }
      - { fr: "ils prennent", ipa: "il pʁɛn", note: "n が 2 つになり [ɛn] と読む" }
    past: { fr: "j'ai pris", ipa: "ʒe pʁi" }
  - slug: "finir"
    inf: "finir"
    ipa: "finiʁ"
    ja: "終える・終わる"
    unit: "03"
    type: "-ir 規則"
    note: "英語の finish（同じ語源）。-ir の規則動詞の代表"
    infinitive: { fr: "finir", ipa: "finiʁ" }
    present:
      - { fr: "je finis", ipa: "ʒə fini" }
      - { fr: "tu finis", ipa: "ty fini" }
      - { fr: "il finit", ipa: "il fini" }
      - { fr: "nous finissons", ipa: "nu finisɔ̃", note: "複数形に -iss- が入る" }
      - { fr: "vous finissez", ipa: "vu finise" }
      - { fr: "ils finissent", ipa: "il finis" }
    past: { fr: "j'ai fini", ipa: "ʒe fini" }
  - slug: "partir"
    inf: "partir"
    ipa: "paʁtiʁ"
    ja: "出発する"
    unit: "03"
    type: "不規則（-ir）"
    note: "英語の leave（出発する）。英語の depart と同じ語源"
    infinitive: { fr: "partir", ipa: "paʁtiʁ" }
    present:
      - { fr: "je pars", ipa: "ʒə paʁ", note: "単数は語幹の t が落ちる" }
      - { fr: "tu pars", ipa: "ty paʁ" }
      - { fr: "il part", ipa: "il paʁ" }
      - { fr: "nous partons", ipa: "nu paʁtɔ̃" }
      - { fr: "vous partez", ipa: "vu paʁte" }
      - { fr: "ils partent", ipa: "il paʁt" }
    past: { fr: "je suis parti(e)", ipa: "ʒə sɥi paʁti", tts: "je suis parti", note: "移動の動詞なので助動詞 être" }
  - slug: "dormir"
    inf: "dormir"
    ipa: "dɔʁmiʁ"
    ja: "眠る"
    unit: "03"
    type: "不規則（-ir）"
    note: "英語の sleep。英語の dormitory（寮）と同じ語源"
    infinitive: { fr: "dormir", ipa: "dɔʁmiʁ" }
    present:
      - { fr: "je dors", ipa: "ʒə dɔʁ", note: "単数は語幹の m が落ちる" }
      - { fr: "tu dors", ipa: "ty dɔʁ" }
      - { fr: "il dort", ipa: "il dɔʁ" }
      - { fr: "nous dormons", ipa: "nu dɔʁmɔ̃" }
      - { fr: "vous dormez", ipa: "vu dɔʁme" }
      - { fr: "ils dorment", ipa: "il dɔʁm" }
    past: { fr: "j'ai dormi", ipa: "ʒe dɔʁmi" }
  - slug: "faire"
    inf: "faire"
    ipa: "fɛʁ"
    ja: "する・作る"
    unit: "04"
    type: "不規則"
    note: "英語の do と make の両方。天気（Il fait beau. = It's nice.）やスポーツ（faire du sport = do sports）にも使う"
    infinitive: { fr: "faire", ipa: "fɛʁ" }
    present:
