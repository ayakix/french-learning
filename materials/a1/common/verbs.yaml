      - { fr: "il préfère", ipa: "il pʁefɛʁ" }
      - { fr: "nous préférons", ipa: "nu pʁefeʁɔ̃" }
      - { fr: "vous préférez", ipa: "vu pʁefeʁe" }
      - { fr: "ils préfèrent", ipa: "il pʁefɛʁ" }
