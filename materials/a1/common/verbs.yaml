    ja: "〜のほうが好きだ"
    unit: "04"
    type: "-er 規則（綴りが変わる）"
    note: "英語の prefer（同じ語源）"
    infinitive: { fr: "préférer", ipa: "pʁefeʁe" }
    present:
      - { fr: "je préfère", ipa: "ʒə pʁefɛʁ", note: "発音される語尾の前で é が è になる" }
