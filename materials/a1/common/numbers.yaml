# 数字・曜日・月・日付・時刻・値段（単元をまたいで使う教材）
# DELF A1 の聞き取りでは、数字・時刻・値段・日付がほぼ毎回問われる。単元ごとに散らばらないよう 1 ファイルにまとめた。
#
# show は画面に出す表記、fr は読ませるテキスト。fr は必ず綴りで書く（数字のまま TTS に渡すと読み方が保証されないため）。
# unit はそのグループを最初に習う単元。
# 数字は後ろの語とつながると音が変わる（six heures [si zœʁ]、neuf ans [nœ vɑ̃]）。
# 単独の読み方だけ覚えると聞き取れないので、ipa はつながったときの実際の発音で書き、注意点を note に書いた。
title: "数字・日付・時刻・値段"
groups:
  - slug: "0-20"
    name: "数字 0〜20"
    unit: "01"
    items:
      - {show: "0", fr: "zéro", ipa: "zeʁo"}
      - {show: "1", fr: "un", ipa: "œ̃", note: "女性名詞の前では une [yn] になる"}
      - {show: "2", fr: "deux", ipa: "dø"}
      - {show: "3", fr: "trois", ipa: "tʁwa"}
      - {show: "4", fr: "quatre", ipa: "katʁ"}
      - {show: "5", fr: "cinq", ipa: "sɛ̃k", note: "単独では最後の q を読む [sɛ̃k]"}
      - {show: "6", fr: "six", ipa: "sis", note: "単独では [sis]。子音の前では [si]、母音の前では [siz] と変わる"}
      - {show: "7", fr: "sept", ipa: "sɛt", tts: "sept !", note: "sept だけだと英語の Sept.（September）と読まれるため、tts は sept !"}
      - {show: "8", fr: "huit", ipa: "ɥit", note: "単独では最後の t を読む [ɥit]。子音の前では [ɥi]"}
      - {show: "9", fr: "neuf", ipa: "nœf", note: "ans / heures の前だけ f が [v] になる（neuf ans [nœ vɑ̃]）"}
      - {show: "10", fr: "dix", ipa: "dis", note: "単独では [dis]。子音の前では [di]、母音の前では [diz] と変わる"}
      - {show: "11", fr: "onze", ipa: "ɔ̃z"}
      - {show: "12", fr: "douze", ipa: "duz"}
      - {show: "13", fr: "treize", ipa: "tʁɛz"}
