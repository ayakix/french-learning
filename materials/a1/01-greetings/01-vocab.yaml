# 単元 01 あいさつ・自己紹介 の必須単語（Web アプリの単語画面 /vocab/01 のデータ）
# 名詞は不定冠詞 un / une を付けて読ませる。性（男性・女性）を音で一緒に覚えるため。
#
# 例外として、国名と言語は定冠詞（le / la / l'）を付ける。「un Japon」とは言わず、実際に使う形で覚えるため。
# 職業は男性形・女性形の両方を言えることが自己紹介に必要なので、形容詞と同じく女性形を f / f_ipa に書き、tts で両方を読ませる。
# 国籍は形容詞として書く（Je suis japonais. のように冠詞なしで使うため）。
# 数字（年齢に使う 0〜20）は common で扱うので、ここには入れない。
unit: "01"
title: "あいさつ・自己紹介"
groups:
  - name: "あいさつ"
    words:
      - { fr: "bonjour", ipa: "bɔ̃ʒuʁ", ja: "こんにちは・おはよう", pos: "表現" }
      - { fr: "bonsoir", ipa: "bɔ̃swaʁ", ja: "こんばんは", pos: "表現" }
      - { fr: "salut", ipa: "saly", ja: "やあ・じゃあね（親しい人に）", pos: "表現" }
      - { fr: "au revoir", ipa: "o ʁəvwaʁ", ja: "さようなら", pos: "表現" }
      - { fr: "à bientôt", ipa: "a bjɛ̃to", ja: "また近いうちに", pos: "表現" }
      - { fr: "à demain", ipa: "a dəmɛ̃", ja: "また明日", pos: "表現" }
      - { fr: "bonne journée", ipa: "bɔn ʒuʁne", ja: "よい一日を", pos: "表現" }
      - { fr: "bonne nuit", ipa: "bɔn nɥi", ja: "おやすみなさい", pos: "表現" }
      - { fr: "Bonjour, madame.", ipa: "bɔ̃ʒuʁ madam", ja: "こんにちは（女性に）", pos: "表現", note: "フランスではあいさつに madame / monsieur を添えるのが礼儀" }
      - { fr: "Bonjour, monsieur.", ipa: "bɔ̃ʒuʁ məsjø", ja: "こんにちは（男性に）", pos: "表現", note: "monsieur の on は鼻母音ではなく [ə] と読む例外" }
      - { fr: "Ça va ?", ipa: "sa va", ja: "元気？", pos: "表現" }
      - { fr: "Ça va bien.", ipa: "sa va bjɛ̃", ja: "元気だよ", pos: "表現" }
      - { fr: "Comment allez-vous ?", ipa: "kɔmɑ̃ tale vu", ja: "お元気ですか（丁寧）", pos: "表現", note: "comment の t が allez とリエゾンする" }
      - { fr: "Très bien, merci.", ipa: "tʁɛ bjɛ̃ mɛʁsi", ja: "とても元気です、ありがとう", pos: "表現" }
      - { fr: "Et vous ?", ipa: "e vu", ja: "あなたは？（丁寧）", pos: "表現" }
      - { fr: "Et toi ?", ipa: "e twa", ja: "君は？", pos: "表現" }
      - { fr: "Enchanté.", ipa: "ɑ̃ʃɑ̃te", ja: "はじめまして", pos: "表現", note: "女性が言うときは Enchantée と書く（発音は同じ）" }
      - { fr: "Bienvenue !", ipa: "bjɛ̃vny", ja: "ようこそ", pos: "表現" }

  - name: "礼儀の表現"
    words:
      - { fr: "merci", ipa: "mɛʁsi", ja: "ありがとう", pos: "表現" }
      - { fr: "merci beaucoup", ipa: "mɛʁsi boku", ja: "どうもありがとう", pos: "表現" }
      - { fr: "de rien", ipa: "də ʁjɛ̃", ja: "どういたしまして", pos: "表現" }
      - { fr: "je vous en prie", ipa: "ʒə vu zɑ̃ pʁi", ja: "どういたしまして（丁寧）", pos: "表現", note: "vous と en がリエゾンして [z] になる" }
      - { fr: "s'il vous plaît", ipa: "sil vu plɛ", ja: "お願いします（丁寧）", pos: "表現" }
      - { fr: "s'il te plaît", ipa: "sil tə plɛ", ja: "お願い（親しい人に）", pos: "表現" }
      - { fr: "pardon", ipa: "paʁdɔ̃", ja: "すみません・ごめんなさい", pos: "表現" }
      - { fr: "excusez-moi", ipa: "ɛkskyze mwa", ja: "すみません（呼びかけ・謝罪）", pos: "表現" }
      - { fr: "désolé", ipa: "dezɔle", ja: "ごめんなさい・残念です", pos: "形容詞", f: "désolée", f_ipa: "dezɔle", tts: "désolé, désolée", note: "女性形も発音は同じ" }
      - { fr: "oui", ipa: "wi", ja: "はい", pos: "表現" }
      - { fr: "non", ipa: "nɔ̃", ja: "いいえ", pos: "表現" }
      - { fr: "d'accord", ipa: "dakɔʁ", ja: "わかりました・OK", pos: "表現" }
      - { fr: "Je ne comprends pas.", ipa: "ʒə nə kɔ̃pʁɑ̃ pa", ja: "わかりません", pos: "表現", note: "否定（ne...pas）は単元 04 で学ぶが、困ったときに使えるよう決まり文句として先に覚える" }
      - { fr: "Répétez, s'il vous plaît.", ipa: "ʁepete sil vu plɛ", ja: "もう一度言ってください", pos: "表現" }

  - name: "主語代名詞"
    words:
      - { fr: "je", ipa: "ʒə", ja: "私は", pos: "代名詞", note: "母音の前では j' になる（j'habite）" }
      - { fr: "tu", ipa: "ty", ja: "君は（親しい相手 1 人）", pos: "代名詞" }
      - { fr: "il", ipa: "il", ja: "彼は・それは", pos: "代名詞" }
      - { fr: "elle", ipa: "ɛl", ja: "彼女は・それは", pos: "代名詞" }
      - { fr: "on", ipa: "ɔ̃", ja: "私たちは（話し言葉）・人は", pos: "代名詞", note: "意味は複数でも動詞は il と同じ形" }
      - { fr: "nous", ipa: "nu", ja: "私たちは", pos: "代名詞" }
      - { fr: "vous", ipa: "vu", ja: "あなたは（丁寧）・あなたたちは", pos: "代名詞", note: "初対面や目上の人には 1 人でも vous を使う" }
      - { fr: "ils", ipa: "il", ja: "彼らは（男性を含む）", pos: "代名詞", note: "女性が 1 人でも男性が混ざれば ils" }
      - { fr: "elles", ipa: "ɛl", ja: "彼女らは（全員女性）", pos: "代名詞" }
      - { fr: "moi", ipa: "mwa", ja: "私（強調）", pos: "代名詞", note: "Moi, je suis japonais. のように主語を強めるときに使う" }
      - { fr: "toi", ipa: "twa", ja: "君（強調）", pos: "代名詞" }
      - { fr: "c'est", ipa: "sɛ", ja: "これは〜です・〜です", pos: "表現", note: "Moi, c'est Paul.（僕はポール）のように名乗るときにも使う" }

  - name: "自己紹介の動詞"
    words:
      - { fr: "être", ipa: "ɛtʁ", ja: "〜である", pos: "動詞" }
      - { fr: "s'appeler", ipa: "saple", ja: "〜という名前である", pos: "動詞" }
      - { fr: "habiter", ipa: "abite", ja: "住む", pos: "動詞", note: "h は読まないので j'habite とエリジオンする" }
      - { fr: "parler", ipa: "paʁle", ja: "話す", pos: "動詞" }
      - { fr: "venir", ipa: "vəniʁ", ja: "来る・〜出身である", pos: "動詞", note: "Je viens de Tokyo.（東京出身です）" }
      - { fr: "travailler", ipa: "tʁavaje", ja: "働く", pos: "動詞" }
      - { fr: "étudier", ipa: "etydje", ja: "勉強する", pos: "動詞" }
      - { fr: "avoir", ipa: "avwaʁ", ja: "持つ・（年齢が）〜歳である", pos: "動詞", note: "年齢は avoir で言う：J'ai vingt ans.（être は使わない）" }
      - { fr: "se présenter", ipa: "sə pʁezɑ̃te", ja: "自己紹介する", pos: "動詞" }

  - name: "自己紹介の言葉とフレーズ"
    words:
      - { fr: "un nom", ipa: "œ̃ nɔ̃", ja: "名字・名前", pos: "名詞", g: "m" }
      - { fr: "un prénom", ipa: "œ̃ pʁenɔ̃", ja: "（姓に対する）名前", pos: "名詞", g: "m" }
      - { fr: "un âge", ipa: "œ̃ naʒ", ja: "年齢", pos: "名詞", g: "m" }
      - { fr: "un an", ipa: "œ̃ nɑ̃", ja: "年・〜歳", pos: "名詞", g: "m" }
      - { fr: "un pays", ipa: "œ̃ pei", ja: "国", pos: "名詞", g: "m" }
      - { fr: "une ville", ipa: "yn vil", ja: "町・都市", pos: "名詞", g: "f" }
      - { fr: "une nationalité", ipa: "yn nasjɔnalite", ja: "国籍", pos: "名詞", g: "f" }
      - { fr: "une langue", ipa: "yn lɑ̃ɡ", ja: "言語", pos: "名詞", g: "f" }
      - { fr: "un métier", ipa: "œ̃ metje", ja: "職業", pos: "名詞", g: "m" }
      - { fr: "et", ipa: "e", ja: "そして・〜と", pos: "接続詞", note: "et の t は読まず、リエゾンもしない" }
      - { fr: "aussi", ipa: "osi", ja: "〜も", pos: "副詞" }
      - { fr: "un peu", ipa: "œ̃ pø", ja: "少し", pos: "副詞" }
      - { fr: "à", ipa: "a", ja: "〜に・〜で（都市の前）", pos: "前置詞", note: "J'habite à Paris." }
      - { fr: "en", ipa: "ɑ̃", ja: "〜に・〜で（女性名詞の国の前）", pos: "前置詞", note: "J'habite en France." }
      - { fr: "au", ipa: "o", ja: "〜に・〜で（男性名詞の国の前）", pos: "前置詞", note: "J'habite au Japon.（à + le が au になる）" }
      - { fr: "Comment tu t'appelles ?", ipa: "kɔmɑ̃ ty tapɛl", ja: "名前は何？", pos: "表現" }
      - { fr: "Je m'appelle Kenji.", ipa: "ʒə mapɛl kɛnʒi", ja: "私の名前はケンジです", pos: "表現", note: "s'appeler は je のとき l が 2 つ（appelle）になり、e を [ɛ] と読む" }
      - { fr: "Tu es d'où ?", ipa: "ty ɛ du", ja: "どこの出身？", pos: "表現" }
      - { fr: "Tu as quel âge ?", ipa: "ty a kɛl aʒ", ja: "何歳？", pos: "表現" }
      - { fr: "J'ai vingt ans.", ipa: "ʒe vɛ̃ tɑ̃", ja: "20 歳です", pos: "表現", note: "vingt の t が ans とリエゾンする" }

  - name: "国と言語"
    words:
      - { fr: "la France", ipa: "la fʁɑ̃s", ja: "フランス", pos: "名詞", g: "f" }
      - { fr: "le Japon", ipa: "lə ʒapɔ̃", ja: "日本", pos: "名詞", g: "m" }
      - { fr: "l'Italie", ipa: "litali", ja: "イタリア", pos: "名詞", g: "f" }
      - { fr: "l'Espagne", ipa: "lɛspaɲ", ja: "スペイン", pos: "名詞", g: "f" }
      - { fr: "l'Allemagne", ipa: "lalmaɲ", ja: "ドイツ", pos: "名詞", g: "f" }
      - { fr: "l'Angleterre", ipa: "lɑ̃ɡlətɛʁ", ja: "イギリス（イングランド）", pos: "名詞", g: "f" }
      - { fr: "les États-Unis", ipa: "le zetazyni", ja: "アメリカ合衆国", pos: "名詞", g: "m", note: "複数形の国なので「〜に」は aux（aux États-Unis）" }
      - { fr: "la Chine", ipa: "la ʃin", ja: "中国", pos: "名詞", g: "f" }
      - { fr: "la Corée", ipa: "la kɔʁe", ja: "韓国・朝鮮", pos: "名詞", g: "f" }
      - { fr: "le Canada", ipa: "lə kanada", ja: "カナダ", pos: "名詞", g: "m" }
      - { fr: "la Belgique", ipa: "la bɛlʒik", ja: "ベルギー", pos: "名詞", g: "f" }
      - { fr: "la Suisse", ipa: "la sɥis", ja: "スイス", pos: "名詞", g: "f" }
      - { fr: "le français", ipa: "lə fʁɑ̃sɛ", ja: "フランス語", pos: "名詞", g: "m", note: "言語名は小文字で書く。parler の後では冠詞を省くことが多い（Je parle français.）" }
      - { fr: "l'anglais", ipa: "lɑ̃ɡlɛ", ja: "英語", pos: "名詞", g: "m" }
      - { fr: "le japonais", ipa: "lə ʒapɔnɛ", ja: "日本語", pos: "名詞", g: "m" }
      - { fr: "l'espagnol", ipa: "lɛspaɲɔl", ja: "スペイン語", pos: "名詞", g: "m" }
      - { fr: "l'allemand", ipa: "lalmɑ̃", ja: "ドイツ語", pos: "名詞", g: "m" }
      - { fr: "l'italien", ipa: "litaljɛ̃", ja: "イタリア語", pos: "名詞", g: "m" }
      - { fr: "le chinois", ipa: "lə ʃinwa", ja: "中国語", pos: "名詞", g: "m" }

  - name: "国籍"
    words:
      - { fr: "japonais", ipa: "ʒapɔnɛ", ja: "日本の・日本人の", pos: "形容詞", f: "japonaise", f_ipa: "ʒapɔnɛz", tts: "japonais, japonaise", note: "国籍は小文字で書く（Je suis japonais.）。「日本人」という名詞のときだけ大文字（un Japonais）" }
      - { fr: "français", ipa: "fʁɑ̃sɛ", ja: "フランスの・フランス人の", pos: "形容詞", f: "française", f_ipa: "fʁɑ̃sɛz", tts: "français, française" }
      - { fr: "anglais", ipa: "ɑ̃ɡlɛ", ja: "イギリスの・イギリス人の", pos: "形容詞", f: "anglaise", f_ipa: "ɑ̃ɡlɛz", tts: "anglais, anglaise" }
      - { fr: "américain", ipa: "ameʁikɛ̃", ja: "アメリカの・アメリカ人の", pos: "形容詞", f: "américaine", f_ipa: "ameʁikɛn", tts: "américain, américaine", note: "女性形は後ろに e が付くので鼻母音でなくなる" }
      - { fr: "italien", ipa: "italjɛ̃", ja: "イタリアの・イタリア人の", pos: "形容詞", f: "italienne", f_ipa: "italjɛn", tts: "italien, italienne" }
      - { fr: "espagnol", ipa: "ɛspaɲɔl", ja: "スペインの・スペイン人の", pos: "形容詞", f: "espagnole", f_ipa: "ɛspaɲɔl", tts: "espagnol, espagnole", note: "女性形も発音は同じ" }
      - { fr: "allemand", ipa: "almɑ̃", ja: "ドイツの・ドイツ人の", pos: "形容詞", f: "allemande", f_ipa: "almɑ̃d", tts: "allemand, allemande" }
      - { fr: "chinois", ipa: "ʃinwa", ja: "中国の・中国人の", pos: "形容詞", f: "chinoise", f_ipa: "ʃinwaz", tts: "chinois, chinoise" }
      - { fr: "coréen", ipa: "kɔʁeɛ̃", ja: "韓国の・韓国人の", pos: "形容詞", f: "coréenne", f_ipa: "kɔʁeɛn", tts: "coréen, coréenne" }
      - { fr: "canadien", ipa: "kanadjɛ̃", ja: "カナダの・カナダ人の", pos: "形容詞", f: "canadienne", f_ipa: "kanadjɛn", tts: "canadien, canadienne" }
      - { fr: "belge", ipa: "bɛlʒ", ja: "ベルギーの・ベルギー人の", pos: "形容詞", note: "e で終わるので男女同じ形" }
      - { fr: "suisse", ipa: "sɥis", ja: "スイスの・スイス人の", pos: "形容詞", note: "e で終わるので男女同じ形" }

  - name: "職業"
    words:
      - { fr: "un étudiant", ipa: "œ̃ netydjɑ̃", ja: "学生", pos: "名詞", g: "m", f: "une étudiante", f_ipa: "yn etydjɑ̃t", tts: "un étudiant, une étudiante", note: "職業を言うときは冠詞を付けない（Je suis étudiant.）" }
      - { fr: "un professeur", ipa: "œ̃ pʁɔfesœʁ", ja: "先生・教師", pos: "名詞", g: "m", f: "une professeure", f_ipa: "yn pʁɔfesœʁ", tts: "un professeur, une professeure" }
      - { fr: "un médecin", ipa: "œ̃ medsɛ̃", ja: "医者", pos: "名詞", g: "m", f: "une médecin", f_ipa: "yn medsɛ̃", tts: "un médecin, une médecin", note: "女性も同じ形で、冠詞だけ変わる" }
      - { fr: "un infirmier", ipa: "œ̃ nɛ̃fiʁmje", ja: "看護師", pos: "名詞", g: "m", f: "une infirmière", f_ipa: "yn ɛ̃fiʁmjɛʁ", tts: "un infirmier, une infirmière" }
      - { fr: "un ingénieur", ipa: "œ̃ nɛ̃ʒenjœʁ", ja: "エンジニア・技師", pos: "名詞", g: "m", f: "une ingénieure", f_ipa: "yn ɛ̃ʒenjœʁ", tts: "un ingénieur, une ingénieure" }
      - { fr: "un employé", ipa: "œ̃ nɑ̃plwaje", ja: "会社員・従業員", pos: "名詞", g: "m", f: "une employée", f_ipa: "yn ɑ̃plwaje", tts: "un employé, une employée" }
      - { fr: "un serveur", ipa: "œ̃ sɛʁvœʁ", ja: "ウェイター", pos: "名詞", g: "m", f: "une serveuse", f_ipa: "yn sɛʁvøz", tts: "un serveur, une serveuse" }
      - { fr: "un vendeur", ipa: "œ̃ vɑ̃dœʁ", ja: "店員・販売員", pos: "名詞", g: "m", f: "une vendeuse", f_ipa: "yn vɑ̃døz", tts: "un vendeur, une vendeuse" }
      - { fr: "un cuisinier", ipa: "œ̃ kɥizinje", ja: "料理人", pos: "名詞", g: "m", f: "une cuisinière", f_ipa: "yn kɥizinjɛʁ", tts: "un cuisinier, une cuisinière" }
      - { fr: "un journaliste", ipa: "œ̃ ʒuʁnalist", ja: "記者・ジャーナリスト", pos: "名詞", g: "m", f: "une journaliste", f_ipa: "yn ʒuʁnalist", tts: "un journaliste, une journaliste" }
      - { fr: "un avocat", ipa: "œ̃ navɔka", ja: "弁護士", pos: "名詞", g: "m", f: "une avocate", f_ipa: "yn avɔkat", tts: "un avocat, une avocate" }
      - { fr: "un informaticien", ipa: "œ̃ nɛ̃fɔʁmatisjɛ̃", ja: "IT エンジニア", pos: "名詞", g: "m", f: "une informaticienne", f_ipa: "yn ɛ̃fɔʁmatisjɛn", tts: "un informaticien, une informaticienne" }
