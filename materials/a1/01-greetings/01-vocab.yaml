# 単元 01 あいさつ・自己紹介 の必須単語（Web アプリの単語画面 /vocab/01 のデータ）
# 名詞は不定冠詞 un / une を付けて読ませる。性（男性・女性）を音で一緒に覚えるため。
#
# 例外として、国名と言語は定冠詞（le / la / l'）を付ける。「un Japon」とは言わず、実際に使う形で覚えるため。
# 職業は男性形・女性形の両方を言えることが自己紹介に必要なので、形容詞と同じく女性形を f / f_ipa に書き、tts で両方を読ませる。
# 国籍は形容詞として書く（Je suis japonais. のように冠詞なしで使うため）。
# 数字（年齢に使う 0〜20）は common で扱うので、ここには入れない。
unit: "01"
title: "あいさつ・自己紹介"
groups:
  - name: "あいさつ"
    words:
      - { fr: "bonjour", ipa: "bɔ̃ʒuʁ", ja: "こんにちは・おはよう", pos: "表現", ex: { fr: "Bonjour, je suis Yuki.", ja: "こんにちは、ユキです。" } }
      - { fr: "bonsoir", ipa: "bɔ̃swaʁ", ja: "こんばんは", pos: "表現", ex: { fr: "Bonsoir, madame Martin !", ja: "マルタンさん、こんばんは！" } }
      - { fr: "salut", ipa: "saly", ja: "やあ・じゃあね（親しい人に）", pos: "表現", ex: { fr: "Salut, Paul ! Ça va ?", ja: "やあ、ポール！元気？" } }
      - { fr: "au revoir", ipa: "o ʁəvwaʁ", ja: "さようなら", pos: "表現", ex: { fr: "Merci, au revoir, madame.", ja: "ありがとうございました、さようなら。" } }
      - { fr: "à bientôt", ipa: "a bjɛ̃to", ja: "また近いうちに", pos: "表現", ex: { fr: "Salut Léa, à bientôt !", ja: "じゃあね、レア、またね！" } }
      - { fr: "à demain", ipa: "a dəmɛ̃", ja: "また明日", pos: "表現", ex: { fr: "Au revoir, Paul, à demain !", ja: "さようなら、ポール、また明日！" } }
      - { fr: "bonne journée", ipa: "bɔn ʒuʁne", ja: "よい一日を", pos: "表現", ex: { fr: "Au revoir et bonne journée !", ja: "さようなら、よい一日を！" } }
      - { fr: "bonne nuit", ipa: "bɔn nɥi", ja: "おやすみなさい", pos: "表現", ex: { fr: "Bonne nuit, Léo, à demain !", ja: "おやすみ、レオ、また明日！" } }
      - { fr: "Bonjour, madame.", ipa: "bɔ̃ʒuʁ madam", ja: "こんにちは（女性に）", pos: "表現", note: "フランスではあいさつに madame / monsieur を添えるのが礼儀", ex: { fr: "Bonjour, madame. Je suis Kenji Sato.", ja: "こんにちは。佐藤ケンジです。" } }
      - { fr: "Bonjour, monsieur.", ipa: "bɔ̃ʒuʁ məsjø", ja: "こんにちは（男性に）", pos: "表現", note: "monsieur の on は鼻母音ではなく [ə] と読む例外", ex: { fr: "Bonjour, monsieur. Vous êtes monsieur Dupont ?", ja: "こんにちは。デュポンさんですか？" } }
      - { fr: "Ça va ?", ipa: "sa va", ja: "元気？", pos: "表現", ex: { fr: "Bonjour, Thomas, ça va ?", ja: "こんにちは、トマ、元気？" } }
      - { fr: "Ça va bien.", ipa: "sa va bjɛ̃", ja: "元気だよ", pos: "表現", ex: { fr: "Ça va bien, merci. Et toi ?", ja: "元気だよ、ありがとう。君は？" } }
      - { fr: "Comment allez-vous ?", ipa: "kɔmɑ̃ tale vu", ja: "お元気ですか（丁寧）", pos: "表現", note: "comment の t が allez とリエゾンする", ex: { fr: "Bonjour, madame Martin. Comment allez-vous ?", ja: "こんにちは、マルタンさん。お元気ですか？" } }
      - { fr: "Très bien, merci.", ipa: "tʁɛ bjɛ̃ mɛʁsi", ja: "とても元気です、ありがとう", pos: "表現", ex: { fr: "Très bien, merci. Et vous, monsieur ?", ja: "とても元気です、ありがとう。あなたは？" } }
      - { fr: "Et vous ?", ipa: "e vu", ja: "あなたは？（丁寧）", pos: "表現", ex: { fr: "Je suis japonais. Et vous ?", ja: "私は日本人です。あなたは？" } }
      - { fr: "Et toi ?", ipa: "e twa", ja: "君は？", pos: "表現", ex: { fr: "Moi, j'ai dix-neuf ans. Et toi ?", ja: "僕は 19 歳。君は？" } }
      - { fr: "Enchanté.", ipa: "ɑ̃ʃɑ̃te", ja: "はじめまして", pos: "表現", note: "女性が言うときは Enchantée と書く（発音は同じ）", ex: { fr: "Enchanté, Sophie ! Moi, c'est Kenji.", ja: "はじめまして、ソフィー！僕はケンジ。" } }
      - { fr: "Bienvenue !", ipa: "bjɛ̃vny", ja: "ようこそ", pos: "表現", ex: { fr: "Bienvenue à Paris, Yuki !", ja: "パリへようこそ、ユキ！" } }

  - name: "礼儀の表現"
    words:
      - { fr: "merci", ipa: "mɛʁsi", ja: "ありがとう", pos: "表現", ex: { fr: "Ah, merci, Paul ! À demain !", ja: "あ、ありがとう、ポール！また明日！" } }
      - { fr: "merci beaucoup", ipa: "mɛʁsi boku", ja: "どうもありがとう", pos: "表現", ex: { fr: "Merci beaucoup, madame, au revoir !", ja: "どうもありがとうございました、さようなら！" } }
      - { fr: "de rien", ipa: "də ʁjɛ̃", ja: "どういたしまして", pos: "表現", ex: { fr: "De rien, Paul, à bientôt !", ja: "どういたしまして、ポール、またね！" } }
      - { fr: "je vous en prie", ipa: "ʒə vu zɑ̃ pʁi", ja: "どういたしまして（丁寧）", pos: "表現", note: "vous と en がリエゾンして [z] になる", ex: { fr: "Je vous en prie, monsieur.", ja: "どういたしまして。" } }
      - { fr: "s'il vous plaît", ipa: "sil vu plɛ", ja: "お願いします（丁寧）", pos: "表現", ex: { fr: "Vous vous appelez comment, s'il vous plaît ?", ja: "お名前は何とおっしゃいますか？" } }
      - { fr: "s'il te plaît", ipa: "sil tə plɛ", ja: "お願い（親しい人に）", pos: "表現", ex: { fr: "Paul, répète, s'il te plaît !", ja: "ポール、もう一回言って！" } }
      - { fr: "pardon", ipa: "paʁdɔ̃", ja: "すみません・ごめんなさい", pos: "表現", ex: { fr: "Pardon, vous êtes madame Martin ?", ja: "すみません、マルタンさんですか？" } }
      - { fr: "excusez-moi", ipa: "ɛkskyze mwa", ja: "すみません（呼びかけ・謝罪）", pos: "表現", ex: { fr: "Excusez-moi, vous parlez anglais ?", ja: "すみません、英語を話されますか？" } }
      - { fr: "désolé", ipa: "dezɔle", ja: "ごめんなさい・残念です", pos: "形容詞", f: "désolée", f_ipa: "dezɔle", tts: "désolé, désolée", note: "女性形も発音は同じ", ex: { fr: "Oh, pardon, je suis désolé !", ja: "あっ、すみません、ごめんなさい！" } }
      - { fr: "oui", ipa: "wi", ja: "はい", pos: "表現", ex: { fr: "Oui, je parle anglais.", ja: "はい、英語を話します。" } }
      - { fr: "non", ipa: "nɔ̃", ja: "いいえ", pos: "表現", ex: { fr: "Non, je suis canadien.", ja: "いいえ、カナダ人です。" } }
      - { fr: "d'accord", ipa: "dakɔʁ", ja: "わかりました・OK", pos: "表現", ex: { fr: "D'accord, merci, à bientôt !", ja: "わかりました、ありがとう、またね！" } }
      - { fr: "Je ne comprends pas.", ipa: "ʒə nə kɔ̃pʁɑ̃ pa", ja: "わかりません", pos: "表現", note: "否定（ne...pas）は単元 04 で学ぶが、困ったときに使えるよう決まり文句として先に覚える", ex: { fr: "Désolé, je ne comprends pas.", ja: "すみません、わかりません。" } }
      - { fr: "Répétez, s'il vous plaît.", ipa: "ʁepete sil vu plɛ", ja: "もう一度言ってください", pos: "表現", ex: { fr: "Pardon ? Répétez, s'il vous plaît.", ja: "え？もう一度言ってください。" } }

  - name: "主語代名詞"
    words:
      - { fr: "je", ipa: "ʒə", ja: "私は", pos: "代名詞", note: "母音の前では j' になる（j'habite）", ex: { fr: "Je m'appelle Yuki Tanaka.", ja: "私の名前は田中ユキです。" } }
      - { fr: "tu", ipa: "ty", ja: "君は（親しい相手 1 人）", pos: "代名詞", ex: { fr: "Tu es étudiant ?", ja: "君は学生？" } }
      - { fr: "il", ipa: "il", ja: "彼は・それは", pos: "代名詞", ex: { fr: "Il s'appelle Marc, il est médecin.", ja: "彼の名前はマルクで、医者です。" } }
      - { fr: "elle", ipa: "ɛl", ja: "彼女は・それは", pos: "代名詞", ex: { fr: "Elle est italienne et elle parle français.", ja: "彼女はイタリア人で、フランス語を話します。" } }
      - { fr: "on", ipa: "ɔ̃", ja: "私たちは（話し言葉）・人は", pos: "代名詞", note: "意味は複数でも動詞は il と同じ形", ex: { fr: "On est étudiants à Nice.", ja: "私たちはニースの学生です。" } }
      - { fr: "nous", ipa: "nu", ja: "私たちは", pos: "代名詞", ex: { fr: "Nous habitons à Tokyo.", ja: "私たちは東京に住んでいます。" } }
      - { fr: "vous", ipa: "vu", ja: "あなたは（丁寧）・あなたたちは", pos: "代名詞", note: "初対面や目上の人には 1 人でも vous を使う", ex: { fr: "Vous êtes français, monsieur ?", ja: "フランスの方ですか？" } }
      - { fr: "ils", ipa: "il", ja: "彼らは（男性を含む）", pos: "代名詞", note: "女性が 1 人でも男性が混ざれば ils", ex: { fr: "Ils s'appellent Paul et Marc.", ja: "彼らの名前はポールとマルクです。" } }
      - { fr: "elles", ipa: "ɛl", ja: "彼女らは（全員女性）", pos: "代名詞", ex: { fr: "Elles sont étudiantes à Lyon.", ja: "彼女たちはリヨンの学生です。" } }
      - { fr: "moi", ipa: "mwa", ja: "私（強調）", pos: "代名詞", note: "Moi, je suis japonais. のように主語を強めるときに使う", ex: { fr: "Moi, je viens de Kyoto.", ja: "私は京都出身です。" } }
      - { fr: "toi", ipa: "twa", ja: "君（強調）", pos: "代名詞", ex: { fr: "Et toi, tu es d'où ?", ja: "で、君はどこの出身？" } }
      - { fr: "c'est", ipa: "sɛ", ja: "これは〜です・〜です", pos: "表現", note: "Moi, c'est Paul.（僕はポール）のように名乗るときにも使う", ex: { fr: "Bonjour, c'est Sophie Martin.", ja: "こんにちは、ソフィー・マルタンです。" } }

  - name: "自己紹介の動詞"
    words:
      - { fr: "être", ipa: "ɛtʁ", ja: "〜である", pos: "動詞", ex: { fr: "Nous sommes japonais.", ja: "私たちは日本人です。" } }
      - { fr: "s'appeler", ipa: "saple", ja: "〜という名前である", pos: "動詞", ex: { fr: "Elle s'appelle Marie.", ja: "彼女の名前はマリーです。" } }
      - { fr: "habiter", ipa: "abite", ja: "住む", pos: "動詞", note: "h は読まないので j'habite とエリジオンする", ex: { fr: "J'habite à Paris.", ja: "パリに住んでいます。" } }
      - { fr: "parler", ipa: "paʁle", ja: "話す", pos: "動詞", ex: { fr: "Je parle japonais et anglais.", ja: "日本語と英語を話します。" } }
      - { fr: "venir", ipa: "vəniʁ", ja: "来る・〜出身である", pos: "動詞", note: "Je viens de Tokyo.（東京出身です）", ex: { fr: "Il vient de Lyon.", ja: "彼はリヨン出身です。" } }
      - { fr: "travailler", ipa: "tʁavaje", ja: "働く", pos: "動詞", ex: { fr: "Je travaille à Tokyo.", ja: "東京で働いています。" } }
      - { fr: "étudier", ipa: "etydje", ja: "勉強する", pos: "動詞", ex: { fr: "Tu étudies à Paris ?", ja: "パリで勉強しているの？" } }
      - { fr: "avoir", ipa: "avwaʁ", ja: "持つ・（年齢が）〜歳である", pos: "動詞", note: "年齢は avoir で言う：J'ai vingt ans.（être は使わない）", ex: { fr: "Elle a seize ans.", ja: "彼女は 16 歳です。" } }
      - { fr: "se présenter", ipa: "sə pʁezɑ̃te", ja: "自己紹介する", pos: "動詞", ex: { fr: "Bonjour, je me présente : Yuki Tanaka.", ja: "こんにちは、自己紹介します。田中ユキです。" } }

  - name: "自己紹介の言葉とフレーズ"
    words:
      - { fr: "un nom", ipa: "œ̃ nɔ̃", ja: "名字・名前", pos: "名詞", g: "m", ex: { fr: "Dupont, c'est un nom français.", ja: "デュポンはフランスの名字です。" } }
      - { fr: "un prénom", ipa: "œ̃ pʁenɔ̃", ja: "（姓に対する）名前", pos: "名詞", g: "m", ex: { fr: "Yuki, c'est un prénom japonais.", ja: "ユキは日本の名前です。" } }
      - { fr: "un âge", ipa: "œ̃ naʒ", ja: "年齢", pos: "名詞", g: "m", ex: { fr: "Vous avez quel âge, madame ?", ja: "おいくつですか？" } }
      - { fr: "un an", ipa: "œ̃ nɑ̃", ja: "年・〜歳", pos: "名詞", g: "m", ex: { fr: "Paul a quinze ans.", ja: "ポールは 15 歳です。" } }
      - { fr: "un pays", ipa: "œ̃ pei", ja: "国", pos: "名詞", g: "m", ex: { fr: "Tu viens de quel pays ?", ja: "どこの国から来たの？" } }
      - { fr: "une ville", ipa: "yn vil", ja: "町・都市", pos: "名詞", g: "f", ex: { fr: "Lyon est une ville française.", ja: "リヨンはフランスの都市です。" } }
      - { fr: "une nationalité", ipa: "yn nasjɔnalite", ja: "国籍", pos: "名詞", g: "f", ex: { fr: "Vous êtes de quelle nationalité ?", ja: "国籍はどちらですか？" } }
      - { fr: "une langue", ipa: "yn lɑ̃ɡ", ja: "言語", pos: "名詞", g: "f", ex: { fr: "Tu parles quelles langues ?", ja: "何語を話すの？" } }
      - { fr: "un métier", ipa: "œ̃ metje", ja: "職業", pos: "名詞", g: "m", ex: { fr: "Quel est le métier de Paul ?", ja: "ポールの職業は何ですか？" } }
      - { fr: "et", ipa: "e", ja: "そして・〜と", pos: "接続詞", note: "et の t は読まず、リエゾンもしない", ex: { fr: "Paul et Léa sont français.", ja: "ポールとレアはフランス人です。" } }
      - { fr: "aussi", ipa: "osi", ja: "〜も", pos: "副詞", ex: { fr: "Moi aussi, je suis étudiant.", ja: "僕も学生です。" } }
      - { fr: "un peu", ipa: "œ̃ pø", ja: "少し", pos: "副詞", ex: { fr: "Je parle un peu français.", ja: "フランス語を少し話します。" } }
      - { fr: "à", ipa: "a", ja: "〜に・〜で（都市の前）", pos: "前置詞", note: "J'habite à Paris.", ex: { fr: "Elle habite à Marseille.", ja: "彼女はマルセイユに住んでいます。" } }
      - { fr: "en", ipa: "ɑ̃", ja: "〜に・〜で（女性名詞の国の前）", pos: "前置詞", note: "J'habite en France.", ex: { fr: "Nous habitons en France.", ja: "私たちはフランスに住んでいます。" } }
      - { fr: "au", ipa: "o", ja: "〜に・〜で（男性名詞の国の前）", pos: "前置詞", note: "J'habite au Japon.（à + le が au になる）", ex: { fr: "Il habite au Canada.", ja: "彼はカナダに住んでいます。" } }
      - { fr: "Comment tu t'appelles ?", ipa: "kɔmɑ̃ ty tapɛl", ja: "名前は何？", pos: "表現", ex: { fr: "Salut ! Comment tu t'appelles ?", ja: "やあ！名前は何？" } }
      - { fr: "Je m'appelle Kenji.", ipa: "ʒə mapɛl kɛnʒi", ja: "私の名前はケンジです", pos: "表現", note: "s'appeler は je のとき l が 2 つ（appelle）になり、e を [ɛ] と読む", ex: { fr: "Enchanté, je m'appelle Kenji.", ja: "はじめまして、ケンジです。" } }
      - { fr: "Tu es d'où ?", ipa: "ty ɛ du", ja: "どこの出身？", pos: "表現", ex: { fr: "Salut, Léa ! Tu es d'où ?", ja: "やあ、レア！どこの出身？" } }
      - { fr: "Tu as quel âge ?", ipa: "ty a kɛl aʒ", ja: "何歳？", pos: "表現", ex: { fr: "Et toi, Thomas, tu as quel âge ?", ja: "で、トマ、君は何歳？" } }
      - { fr: "J'ai vingt ans.", ipa: "ʒe vɛ̃ tɑ̃", ja: "20 歳です", pos: "表現", note: "vingt の t が ans とリエゾンする", ex: { fr: "Moi, j'ai vingt ans.", ja: "僕は 20 歳です。" } }

  - name: "国と言語"
    words:
      - { fr: "la France", ipa: "la fʁɑ̃s", ja: "フランス", pos: "名詞", g: "f", ex: { fr: "Paris est en France.", ja: "パリはフランスにあります。" } }
      - { fr: "le Japon", ipa: "lə ʒapɔ̃", ja: "日本", pos: "名詞", g: "m", ex: { fr: "J'habite au Japon, à Kyoto.", ja: "日本の京都に住んでいます。" } }
      - { fr: "l'Italie", ipa: "litali", ja: "イタリア", pos: "名詞", g: "f", ex: { fr: "Rome est en Italie.", ja: "ローマはイタリアにあります。" } }
      - { fr: "l'Espagne", ipa: "lɛspaɲ", ja: "スペイン", pos: "名詞", g: "f", ex: { fr: "Elle habite en Espagne.", ja: "彼女はスペインに住んでいます。" } }
      - { fr: "l'Allemagne", ipa: "lalmaɲ", ja: "ドイツ", pos: "名詞", g: "f", ex: { fr: "Il travaille en Allemagne.", ja: "彼はドイツで働いています。" } }
      - { fr: "l'Angleterre", ipa: "lɑ̃ɡlətɛʁ", ja: "イギリス（イングランド）", pos: "名詞", g: "f", ex: { fr: "Londres est en Angleterre.", ja: "ロンドンはイングランドにあります。" } }
      - { fr: "les États-Unis", ipa: "le zetazyni", ja: "アメリカ合衆国", pos: "名詞", g: "m", note: "複数形の国なので「〜に」は aux（aux États-Unis）", ex: { fr: "Ils habitent aux États-Unis.", ja: "彼らはアメリカに住んでいます。" } }
      - { fr: "la Chine", ipa: "la ʃin", ja: "中国", pos: "名詞", g: "f", ex: { fr: "Elle étudie en Chine.", ja: "彼女は中国で勉強しています。" } }
      - { fr: "la Corée", ipa: "la kɔʁe", ja: "韓国・朝鮮", pos: "名詞", g: "f", ex: { fr: "Séoul est en Corée.", ja: "ソウルは韓国にあります。" } }
      - { fr: "le Canada", ipa: "lə kanada", ja: "カナダ", pos: "名詞", g: "m", ex: { fr: "Montréal est au Canada.", ja: "モントリオールはカナダにあります。" } }
      - { fr: "la Belgique", ipa: "la bɛlʒik", ja: "ベルギー", pos: "名詞", g: "f", ex: { fr: "Nous travaillons en Belgique.", ja: "私たちはベルギーで働いています。" } }
      - { fr: "la Suisse", ipa: "la sɥis", ja: "スイス", pos: "名詞", g: "f", ex: { fr: "Genève est en Suisse.", ja: "ジュネーヴはスイスにあります。" } }
      - { fr: "le français", ipa: "lə fʁɑ̃sɛ", ja: "フランス語", pos: "名詞", g: "m", note: "言語名は小文字で書く。parler の後では冠詞を省くことが多い（Je parle français.）", ex: { fr: "J'étudie le français à Nice.", ja: "ニースでフランス語を勉強しています。" } }
      - { fr: "l'anglais", ipa: "lɑ̃ɡlɛ", ja: "英語", pos: "名詞", g: "m", ex: { fr: "Tu parles anglais ?", ja: "英語を話す？" } }
      - { fr: "le japonais", ipa: "lə ʒapɔnɛ", ja: "日本語", pos: "名詞", g: "m", ex: { fr: "Kenji parle japonais et français.", ja: "ケンジは日本語とフランス語を話します。" } }
      - { fr: "l'espagnol", ipa: "lɛspaɲɔl", ja: "スペイン語", pos: "名詞", g: "m", ex: { fr: "Vous parlez espagnol ?", ja: "スペイン語を話されますか？" } }
