# 単元 06 買い物と食事 の必須単語（Web アプリの単語画面 /vocab/06 のデータ）
# 名詞は不定冠詞 un / une を付けて読ませる。性（男性・女性）を音で一緒に覚えるため。
# 数えられない食べ物・飲み物は部分冠詞 du / de la / de l' で書く。注文や買い物では、この形でそのまま使うため。
# 服とサイズも買い物の場面として含める（色は単元 02 で扱うので除く）。
# 数字・値段の言い方は common で扱うのでここには入れない。店の建物のうち食べ物以外（pharmacie など）は単元 05 で扱う。
unit: "06"
title: "買い物と食事"
groups:
  - name: "食べ物（主食・肉・魚）"
    words:
      - {fr: "du pain", ipa: "dy pɛ̃", ja: "パン", pos: "名詞", g: "m"}
      - {fr: "une baguette", ipa: "yn baɡɛt", ja: "バゲット", pos: "名詞", g: "f"}
      - {fr: "un croissant", ipa: "œ̃ kʁwasɑ̃", ja: "クロワッサン", pos: "名詞", g: "m"}
      - {fr: "du riz", ipa: "dy ʁi", ja: "米・ごはん", pos: "名詞", g: "m"}
      - {fr: "des pâtes", ipa: "de pat", ja: "パスタ", pos: "名詞", g: "f", note: "パスタの意味では複数形で使う"}
      - {fr: "de la viande", ipa: "də la vjɑ̃d", ja: "肉", pos: "名詞", g: "f"}
      - {fr: "du poulet", ipa: "dy pulɛ", ja: "鶏肉", pos: "名詞", g: "m"}
      - {fr: "du bœuf", ipa: "dy bœf", ja: "牛肉", pos: "名詞", g: "m"}
      - {fr: "du porc", ipa: "dy pɔʁ", ja: "豚肉", pos: "名詞", g: "m", note: "語末の c は読まない"}
      - {fr: "du jambon", ipa: "dy ʒɑ̃bɔ̃", ja: "ハム", pos: "名詞", g: "m"}
      - {fr: "du poisson", ipa: "dy pwasɔ̃", ja: "魚", pos: "名詞", g: "m"}
      - {fr: "un œuf", ipa: "œ̃ nœf", ja: "卵", pos: "名詞", g: "m", pl: "des œufs", note: "複数形 des œufs は [de zø]。f を読まなくなる"}
