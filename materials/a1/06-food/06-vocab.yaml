      - {fr: "du poivre", ipa: "dy pwavʁ", ja: "こしょう", pos: "名詞", g: "m"}
      - {fr: "de la confiture", ipa: "də la kɔ̃fityʁ", ja: "ジャム", pos: "名詞", g: "f"}
      - {fr: "du chocolat", ipa: "dy ʃɔkɔla", ja: "チョコレート", pos: "名詞", g: "m"}
      - {fr: "un gâteau", ipa: "œ̃ ɡato", ja: "ケーキ", pos: "名詞", g: "m", pl: "des gâteaux"}
      - {fr: "une tarte", ipa: "yn taʁt", ja: "タルト", pos: "名詞", g: "f"}
      - {fr: "de la glace", ipa: "də la ɡlas", ja: "アイスクリーム", pos: "名詞", g: "f"}
  - name: "飲み物"
    words:
