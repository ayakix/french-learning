# 単元 06 買い物と食事 の必須単語（Web アプリの単語画面 /vocab/06 のデータ）
# 名詞は不定冠詞 un / une を付けて読ませる。性（男性・女性）を音で一緒に覚えるため。
# 数えられない食べ物・飲み物は部分冠詞 du / de la / de l' で書く。注文や買い物では、この形でそのまま使うため。
# 服とサイズも買い物の場面として含める（色は単元 02 で扱うので除く）。
# 数字・値段の言い方は common で扱うのでここには入れない。店の建物のうち食べ物以外（pharmacie など）は単元 05 で扱う。
unit: "06"
title: "買い物と食事"
groups:
  - name: "食べ物（主食・肉・魚）"
    words:
      - {fr: "du pain", ipa: "dy pɛ̃", ja: "パン", pos: "名詞", g: "m", ex: {fr: "Je voudrais du pain, s'il vous plaît.", ja: "パンをください。"}}
      - {fr: "une baguette", ipa: "yn baɡɛt", ja: "バゲット", pos: "名詞", g: "f", ex: {fr: "Une baguette coûte un euro vingt.", ja: "バゲットは 1 ユーロ 20 です。"}}
      - {fr: "un croissant", ipa: "œ̃ kʁwasɑ̃", ja: "クロワッサン", pos: "名詞", g: "m", ex: {fr: "Je voudrais deux croissants, s'il vous plaît.", ja: "クロワッサンを 2 つください。"}}
      - {fr: "du riz", ipa: "dy ʁi", ja: "米・ごはん", pos: "名詞", g: "m", ex: {fr: "Au Japon, on mange du riz.", ja: "日本ではごはんを食べます。"}}
      - {fr: "des pâtes", ipa: "de pat", ja: "パスタ", pos: "名詞", g: "f", note: "パスタの意味では複数形で使う", ex: {fr: "Ce soir, je mange des pâtes.", ja: "今夜はパスタを食べます。"}}
      - {fr: "de la viande", ipa: "də la vjɑ̃d", ja: "肉", pos: "名詞", g: "f", ex: {fr: "Il y a de la viande dans ce plat ?", ja: "この料理に肉は入っていますか？"}}
      - {fr: "du poulet", ipa: "dy pulɛ", ja: "鶏肉", pos: "名詞", g: "m", ex: {fr: "Je voudrais du poulet avec du riz.", ja: "鶏肉とごはんをお願いします。"}}
      - {fr: "du bœuf", ipa: "dy bœf", ja: "牛肉", pos: "名詞", g: "m", ex: {fr: "Ce soir, on mange du bœuf.", ja: "今夜は牛肉を食べます。"}}
      - {fr: "du porc", ipa: "dy pɔʁ", ja: "豚肉", pos: "名詞", g: "m", note: "語末の c は読まない", ex: {fr: "Mon ami ne mange pas de porc.", ja: "友達は豚肉を食べません。"}}
      - {fr: "du jambon", ipa: "dy ʒɑ̃bɔ̃", ja: "ハム", pos: "名詞", g: "m", ex: {fr: "J'achète du jambon et du fromage.", ja: "ハムとチーズを買います。"}}
      - {fr: "du poisson", ipa: "dy pwasɔ̃", ja: "魚", pos: "名詞", g: "m", ex: {fr: "Le vendredi, nous mangeons du poisson.", ja: "金曜日、私たちは魚を食べます。"}}
      - {fr: "un œuf", ipa: "œ̃ nœf", ja: "卵", pos: "名詞", g: "m", pl: "des œufs", note: "複数形 des œufs は [de zø]。f を読まなくなる", ex: {fr: "Je voudrais six œufs, s'il vous plaît.", ja: "卵を 6 個ください。"}}
      - {fr: "de la soupe", ipa: "də la sup", ja: "スープ", pos: "名詞", g: "f", ex: {fr: "Le soir, je mange de la soupe chaude.", ja: "夜は温かいスープを飲みます。"}}
      - {fr: "de la salade", ipa: "də la salad", ja: "サラダ・レタス", pos: "名詞", g: "f", ex: {fr: "À midi, je mange de la salade.", ja: "お昼にサラダを食べます。"}}
      - {fr: "un sandwich", ipa: "œ̃ sɑ̃dwitʃ", ja: "サンドイッチ", pos: "名詞", g: "m", ex: {fr: "À midi, je mange un sandwich au parc.", ja: "お昼は公園でサンドイッチを食べます。"}}
  - name: "野菜・果物"
    words:
      - {fr: "un fruit", ipa: "œ̃ fʁɥi", ja: "果物", pos: "名詞", g: "m", ex: {fr: "Je mange un fruit au petit-déjeuner.", ja: "朝食に果物を 1 つ食べます。"}}
      - {fr: "un légume", ipa: "œ̃ leɡym", ja: "野菜", pos: "名詞", g: "m", ex: {fr: "Je mange beaucoup de légumes.", ja: "私は野菜をたくさん食べます。"}}
      - {fr: "une pomme", ipa: "yn pɔm", ja: "りんご", pos: "名詞", g: "f", ex: {fr: "Je mange une pomme tous les jours.", ja: "私は毎日りんごを 1 個食べます。"}}
      - {fr: "une banane", ipa: "yn banan", ja: "バナナ", pos: "名詞", g: "f", ex: {fr: "Il y a une banane dans mon sac.", ja: "かばんにバナナが 1 本あります。"}}
      - {fr: "une orange", ipa: "yn ɔʁɑ̃ʒ", ja: "オレンジ", pos: "名詞", g: "f", ex: {fr: "Je voudrais trois oranges, s'il vous plaît.", ja: "オレンジを 3 つください。"}}
      - {fr: "une fraise", ipa: "yn fʁɛz", ja: "いちご", pos: "名詞", g: "f", ex: {fr: "J'aime beaucoup les fraises.", ja: "私はいちごが大好きです。"}}
      - {fr: "du raisin", ipa: "dy ʁɛzɛ̃", ja: "ぶどう", pos: "名詞", g: "m", note: "ぶどうは房ごと数えないので、ふつう単数の du raisin", ex: {fr: "J'achète du raisin au marché.", ja: "市場でぶどうを買います。"}}
      - {fr: "un citron", ipa: "œ̃ sitʁɔ̃", ja: "レモン", pos: "名詞", g: "m", ex: {fr: "Un thé au citron, s'il vous plaît.", ja: "レモンティーをお願いします。"}}
      - {fr: "une tomate", ipa: "yn tɔmat", ja: "トマト", pos: "名詞", g: "f", ex: {fr: "Je voudrais une salade de tomates.", ja: "トマトサラダをお願いします。"}}
      - {fr: "une pomme de terre", ipa: "yn pɔm də tɛʁ", ja: "じゃがいも", pos: "名詞", g: "f", note: "直訳は「大地のりんご」", ex: {fr: "Les pommes de terre ne sont pas chères.", ja: "じゃがいもは高くありません。"}}
      - {fr: "une carotte", ipa: "yn kaʁɔt", ja: "にんじん", pos: "名詞", g: "f", ex: {fr: "Mon fils n'aime pas les carottes.", ja: "息子はにんじんが好きではありません。"}}
      - {fr: "un oignon", ipa: "œ̃ nɔɲɔ̃", ja: "たまねぎ", pos: "名詞", g: "m", note: "oi を「オ」と読む例外", ex: {fr: "Il y a un oignon dans la soupe.", ja: "スープにたまねぎが 1 個入っています。"}}
  - name: "乳製品・甘いもの・調味料"
    words:
      - {fr: "du fromage", ipa: "dy fʁɔmaʒ", ja: "チーズ", pos: "名詞", g: "m", ex: {fr: "Le fromage français est délicieux.", ja: "フランスのチーズはとてもおいしい。"}}
      - {fr: "du beurre", ipa: "dy bœʁ", ja: "バター", pos: "名詞", g: "m", ex: {fr: "J'achète du beurre au supermarché.", ja: "スーパーでバターを買います。"}}
      - {fr: "un yaourt", ipa: "œ̃ jauʁt", ja: "ヨーグルト", pos: "名詞", g: "m", note: "1 個ずつのカップで数えるので un。語末の t は読まない人もいる", ex: {fr: "Mon fils mange un yaourt au dessert.", ja: "息子はデザートにヨーグルトを食べます。"}}
      - {fr: "du sucre", ipa: "dy sykʁ", ja: "砂糖", pos: "名詞", g: "m", ex: {fr: "Vous voulez du sucre dans votre café ?", ja: "コーヒーに砂糖を入れますか？"}}
      - {fr: "du sel", ipa: "dy sɛl", ja: "塩", pos: "名詞", g: "m", ex: {fr: "Le sel est sur la table.", ja: "塩はテーブルの上にあります。"}}
      - {fr: "du poivre", ipa: "dy pwavʁ", ja: "こしょう", pos: "名詞", g: "m", ex: {fr: "Du sel et du poivre, s'il vous plaît.", ja: "塩とこしょうをお願いします。"}}
      - {fr: "de la confiture", ipa: "də la kɔ̃fityʁ", ja: "ジャム", pos: "名詞", g: "f", ex: {fr: "Le matin, je mange du pain avec de la confiture.", ja: "朝はパンにジャムをつけて食べます。"}}
      - {fr: "du chocolat", ipa: "dy ʃɔkɔla", ja: "チョコレート", pos: "名詞", g: "m", ex: {fr: "Les enfants adorent le chocolat.", ja: "子どもたちはチョコレートが大好きです。"}}
      - {fr: "un gâteau", ipa: "œ̃ ɡato", ja: "ケーキ", pos: "名詞", g: "m", pl: "des gâteaux", ex: {fr: "C'est l'anniversaire de Léa : on achète un gâteau.", ja: "レアの誕生日なので、ケーキを買います。"}}
      - {fr: "une tarte", ipa: "yn taʁt", ja: "タルト", pos: "名詞", g: "f", ex: {fr: "La tarte aux pommes est délicieuse.", ja: "りんごのタルトはとてもおいしい。"}}
      - {fr: "de la glace", ipa: "də la ɡlas", ja: "アイスクリーム", pos: "名詞", g: "f", ex: {fr: "Tu veux de la glace au chocolat ?", ja: "チョコレートアイスはいる？"}}
  - name: "飲み物"
    words:
      - {fr: "de l'eau", ipa: "də lo", ja: "水", pos: "名詞", g: "f", note: "母音で始まる語の前では de la / du ではなく de l'", ex: {fr: "Les enfants boivent de l'eau.", ja: "子どもたちは水を飲みます。"}}
      - {fr: "de l'eau minérale", ipa: "də lo mineʁal", ja: "ミネラルウォーター", pos: "名詞", g: "f", ex: {fr: "Je bois de l'eau minérale au restaurant.", ja: "レストランではミネラルウォーターを飲みます。"}}
      - {fr: "du café", ipa: "dy kafe", ja: "コーヒー", pos: "名詞", g: "m", note: "カフェで 1 杯注文するときは un café", ex: {fr: "Je bois un café après le repas.", ja: "食後にコーヒーを飲みます。"}}
      - {fr: "du thé", ipa: "dy te", ja: "紅茶・お茶", pos: "名詞", g: "m", ex: {fr: "Ma mère boit du thé vert.", ja: "母は緑茶を飲みます。"}}
      - {fr: "du lait", ipa: "dy lɛ", ja: "牛乳", pos: "名詞", g: "m", ex: {fr: "Je voudrais un café au lait.", ja: "カフェオレをください。"}}
      - {fr: "du jus d'orange", ipa: "dy ʒy dɔʁɑ̃ʒ", ja: "オレンジジュース", pos: "名詞", g: "m", ex: {fr: "Un jus d'orange, s'il vous plaît.", ja: "オレンジジュースを 1 杯お願いします。"}}
      - {fr: "du vin", ipa: "dy vɛ̃", ja: "ワイン", pos: "名詞", g: "m", ex: {fr: "On boit du vin avec le fromage.", ja: "チーズと一緒にワインを飲みます。"}}
      - {fr: "de la bière", ipa: "də la bjɛʁ", ja: "ビール", pos: "名詞", g: "f", ex: {fr: "Il ne boit pas de bière.", ja: "彼はビールを飲みません。"}}
      - {fr: "un chocolat chaud", ipa: "œ̃ ʃɔkɔla ʃo", ja: "ホットチョコレート（ココア）", pos: "名詞", g: "m", ex: {fr: "Mon fils boit un chocolat chaud au café.", ja: "息子はカフェでココアを飲みます。"}}
      - {fr: "une boisson", ipa: "yn bwasɔ̃", ja: "飲み物", pos: "名詞", g: "f", ex: {fr: "Et comme boisson, madame ?", ja: "お飲み物はいかがなさいますか？"}}
  - name: "食事と味"
    words:
      - {fr: "un repas", ipa: "œ̃ ʁəpa", ja: "食事", pos: "名詞", g: "m", ex: {fr: "Le repas est à sept heures et demie.", ja: "食事は 7 時半です。"}}
      - {fr: "un plat", ipa: "œ̃ pla", ja: "料理・メインディッシュ", pos: "名詞", g: "m", ex: {fr: "Le plat coûte douze euros.", ja: "その料理は 12 ユーロです。"}}
      - {fr: "un dessert", ipa: "œ̃ desɛʁ", ja: "デザート", pos: "名詞", g: "m", note: "ss は [s]。désert（砂漠）[dezɛʁ] と区別する", ex: {fr: "Comme dessert, je voudrais une glace.", ja: "デザートにはアイスをお願いします。"}}
      - {fr: "manger", ipa: "mɑ̃ʒe", ja: "食べる", pos: "動詞", ex: {fr: "Nous mangeons au restaurant ce soir.", ja: "今夜、私たちはレストランで食べます。"}}
      - {fr: "boire", ipa: "bwaʁ", ja: "飲む", pos: "動詞", ex: {fr: "Je bois beaucoup d'eau.", ja: "私は水をたくさん飲みます。"}}
      - {fr: "avoir faim", ipa: "avwaʁ fɛ̃", ja: "お腹がすいている", pos: "表現", note: "「空腹を持つ」と言う。être ではなく avoir", ex: {fr: "J'ai faim ! On mange ?", ja: "お腹がすいた！食べようか？"}}
      - {fr: "avoir soif", ipa: "avwaʁ swaf", ja: "のどが渇いている", pos: "表現", ex: {fr: "Tu as soif ?", ja: "のどが渇いてる？"}}
      - {fr: "bon", ipa: "bɔ̃", ja: "おいしい・良い", pos: "形容詞", f: "bonne", f_ipa: "bɔn", tts: "bon, bonne", ex: {fr: "Cette soupe est bonne.", ja: "このスープはおいしい。"}}
      - {fr: "délicieux", ipa: "delisjø", ja: "とてもおいしい", pos: "形容詞", f: "délicieuse", f_ipa: "delisjøz", tts: "délicieux, délicieuse", ex: {fr: "Le poulet est délicieux !", ja: "鶏肉がとてもおいしい！"}}
      - {fr: "chaud", ipa: "ʃo", ja: "熱い・温かい", pos: "形容詞", f: "chaude", f_ipa: "ʃod", tts: "chaud, chaude", ex: {fr: "Attention, l'assiette est chaude !", ja: "気をつけて、お皿が熱いよ！"}}
      - {fr: "froid", ipa: "fʁwa", ja: "冷たい", pos: "形容詞", f: "froide", f_ipa: "fʁwad", tts: "froid, froide", ex: {fr: "Je voudrais une bière bien froide.", ja: "よく冷えたビールをください。"}}
  - name: "レストラン・カフェ"
    words:
      - {fr: "un restaurant", ipa: "œ̃ ʁɛstɔʁɑ̃", ja: "レストラン", pos: "名詞", g: "m", ex: {fr: "Il y a un bon restaurant près d'ici.", ja: "この近くにいいレストランがあります。"}}
      - {fr: "une terrasse", ipa: "yn tɛʁas", ja: "テラス席", pos: "名詞", g: "f", ex: {fr: "On mange en terrasse ?", ja: "テラス席で食べる？"}}
      - {fr: "une carte", ipa: "yn kaʁt", ja: "メニュー（料理の一覧）", pos: "名詞", g: "f", note: "料理の一覧は la carte。カードの意味もある", ex: {fr: "La carte, s'il vous plaît.", ja: "メニューをお願いします。"}}
      - {fr: "un menu", ipa: "œ̃ məny", ja: "コース・定食", pos: "名詞", g: "m", note: "フランスでは「前菜＋メインなどのセット」のこと。一覧表は la carte", ex: {fr: "Le menu à quinze euros, s'il vous plaît.", ja: "15 ユーロのコースをお願いします。"}}
      - {fr: "le plat du jour", ipa: "lə pla dy ʒuʁ", ja: "日替わり料理", pos: "表現", ex: {fr: "Le plat du jour, c'est du poisson.", ja: "日替わり料理は魚です。"}}
      - {fr: "une serveuse", ipa: "yn sɛʁvøz", ja: "ウェイトレス", pos: "名詞", g: "f", ex: {fr: "La serveuse est très gentille.", ja: "ウェイトレスはとても親切です。"}}
      - {fr: "une addition", ipa: "yn adisjɔ̃", ja: "お会計・勘定", pos: "名詞", g: "f", ex: {fr: "Je peux avoir l'addition ?", ja: "お会計をお願いできますか？"}}
      - {fr: "une assiette", ipa: "yn asjɛt", ja: "皿", pos: "名詞", g: "f", ex: {fr: "Je voudrais une autre assiette, s'il vous plaît.", ja: "別のお皿をお願いします。"}}
      - {fr: "une fourchette", ipa: "yn fuʁʃɛt", ja: "フォーク", pos: "名詞", g: "f", ex: {fr: "Je n'ai pas de fourchette.", ja: "フォークがありません。"}}
      - {fr: "un couteau", ipa: "œ̃ kuto", ja: "ナイフ", pos: "名詞", g: "m", pl: "des couteaux", ex: {fr: "Vous avez un couteau, s'il vous plaît ?", ja: "ナイフはありますか？"}}
      - {fr: "une cuillère", ipa: "yn kɥijɛʁ", ja: "スプーン", pos: "名詞", g: "f", ex: {fr: "On mange la soupe avec une cuillère.", ja: "スープはスプーンで食べます。"}}
      - {fr: "un pourboire", ipa: "œ̃ puʁbwaʁ", ja: "チップ", pos: "名詞", g: "m", ex: {fr: "Je laisse un pourboire à la serveuse.", ja: "ウェイトレスにチップを置きます。"}}
      - {fr: "commander", ipa: "kɔmɑ̃de", ja: "注文する", pos: "動詞", ex: {fr: "Vous voulez commander ?", ja: "ご注文はお決まりですか？"}}
      - {fr: "réserver", ipa: "ʁezɛʁve", ja: "予約する", pos: "動詞", ex: {fr: "Je voudrais réserver une table pour deux.", ja: "2 人で予約したいのですが。"}}
      - {fr: "Bon appétit !", ipa: "bɔ̃ napeti", ja: "召し上がれ・いただきます", pos: "表現", note: "bon の n が次の母音につながる", ex: {fr: "Bon appétit, les enfants !", ja: "みんな、召し上がれ！"}}
      - {fr: "L'addition, s'il vous plaît.", ipa: "ladisjɔ̃ sil vu plɛ", ja: "お会計をお願いします。", pos: "表現", ex: {fr: "Monsieur, l'addition, s'il vous plaît.", ja: "すみません、お会計をお願いします。"}}
      - {fr: "Sur place ou à emporter ?", ipa: "syʁ plas u a ɑ̃pɔʁte", ja: "店内でお召し上がりですか、お持ち帰りですか？", pos: "表現", ex: {fr: "Bonjour, sur place ou à emporter ?", ja: "いらっしゃいませ。店内ですか、お持ち帰りですか？"}}
  - name: "店と買い物"
    words:
      - {fr: "une boulangerie", ipa: "yn bulɑ̃ʒʁi", ja: "パン屋", pos: "名詞", g: "f", ex: {fr: "La boulangerie est à côté de la poste.", ja: "パン屋は郵便局の隣です。"}}
      - {fr: "une boucherie", ipa: "yn buʃʁi", ja: "肉屋", pos: "名詞", g: "f", ex: {fr: "J'achète du poulet à la boucherie.", ja: "肉屋で鶏肉を買います。"}}
      - {fr: "une épicerie", ipa: "yn episʁi", ja: "食料品店", pos: "名詞", g: "f", ex: {fr: "L'épicerie est ouverte le dimanche.", ja: "その食料品店は日曜日も開いています。"}}
      - {fr: "un supermarché", ipa: "œ̃ sypɛʁmaʁʃe", ja: "スーパー", pos: "名詞", g: "m", ex: {fr: "Je fais les courses au supermarché.", ja: "スーパーで買い物をします。"}}
      - {fr: "un marché", ipa: "œ̃ maʁʃe", ja: "市場・マルシェ", pos: "名詞", g: "m", ex: {fr: "Il y a un marché le samedi matin.", ja: "土曜の朝にマルシェがあります。"}}
      - {fr: "un magasin", ipa: "œ̃ maɡazɛ̃", ja: "店", pos: "名詞", g: "m", ex: {fr: "Ce magasin est fermé le lundi.", ja: "この店は月曜日が休みです。"}}
      - {fr: "un client", ipa: "œ̃ klijɑ̃", ja: "客（男性）", pos: "名詞", g: "m", ex: {fr: "Il y a beaucoup de clients aujourd'hui.", ja: "今日はお客さんが多いです。"}}
      - {fr: "une cliente", ipa: "yn klijɑ̃t", ja: "客（女性）", pos: "名詞", g: "f", ex: {fr: "La cliente veut un kilo de tomates.", ja: "女性客はトマトを 1 キロ欲しがっています。"}}
      - {fr: "une vendeuse", ipa: "yn vɑ̃døz", ja: "店員（女性）", pos: "名詞", g: "f", ex: {fr: "Je demande le prix à la vendeuse.", ja: "店員に値段を聞きます。"}}
      - {fr: "un prix", ipa: "œ̃ pʁi", ja: "値段", pos: "名詞", g: "m", note: "語末の x は読まない", ex: {fr: "Je regarde les prix au supermarché.", ja: "スーパーで値段を見ます。"}}
      - {fr: "un euro", ipa: "œ̃ nøʁo", ja: "ユーロ", pos: "名詞", g: "m", ex: {fr: "Un croissant coûte un euro.", ja: "クロワッサンは 1 ユーロです。"}}
