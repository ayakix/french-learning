      - {fr: "une banane", ipa: "yn banan", ja: "バナナ", pos: "名詞", g: "f"}
      - {fr: "une orange", ipa: "yn ɔʁɑ̃ʒ", ja: "オレンジ", pos: "名詞", g: "f"}
      - {fr: "une fraise", ipa: "yn fʁɛz", ja: "いちご", pos: "名詞", g: "f"}
